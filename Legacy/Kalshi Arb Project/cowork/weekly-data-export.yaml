---
# cowork/weekly-data-export.yaml
# ──────────────────────────────────────────────────────────────────────────────
# Automation: Archive a full week of trading data to timestamped CSV files.
#
# What it does
# ────────────
#   1. Exports the full trade_log.jsonl → data/exports/archive/
#      trade_log_YYYY-WXX.csv (ISO week number).
#   2. Exports unmatched_markets.jsonl → unmatched_YYYY-WXX.csv.
#   3. Runs the backtester and exports equity_curve_YYYY-WXX.csv and
#      backtest_report_YYYY-WXX.csv.
#   4. Prints a compact weekly P&L summary: total trades, win rate,
#      total P&L, best and worst sports by ROI, and week-over-week change
#      from daily_summary.csv.
#   5. Rotates (deletes) trade log entries older than 90 days to prevent
#      unbounded growth — the archived CSV above is the permanent record.
#
# Scheduling
# ──────────
#   Every Monday at 6:00 am local time, covering the previous week's data.
# ──────────────────────────────────────────────────────────────────────────────

name: weekly-data-export
display_name: "Weekly Data Archive & Report"
description: >
  Archive the week's trade log and unmatched markets to timestamped CSV files,
  run a full backtest and save the equity curve and per-sport report, print a
  weekly P&L summary, and rotate trade log entries older than 90 days.
version: "1.0"
category: reporting

trigger:
  type: scheduled
  cron: "0 6 * * 1"    # 6:00 am every Monday
  timezone: local

environment:
  working_directory: "."
  python_executable: python3
  required_files:
    - config.yaml

steps:
  - id: compute_week_label
    name: "Determine the ISO week label"
    description: >
      Print the ISO week label (e.g. 2024-W03) so subsequent steps can use it
      for filenames.  Write it to a small probe file for reuse.
    command: python3
    args:
      - "-c"
      - |
        from datetime import datetime, timedelta, timezone
        from pathlib import Path
        # Use the previous week (run on Monday = archive the week just ended)
        now = datetime.now(tz=timezone.utc)
        last_week = now - timedelta(weeks=1)
        iso = last_week.isocalendar()
        label = f"{iso[0]}-W{iso[1]:02d}"
        Path('data/exports/archive').mkdir(parents=True, exist_ok=True)
        Path('/tmp/week_label.txt').write_text(label, encoding='utf-8')
        print(f"[INFO] Archiving data for ISO week: {label}")
    on_failure: abort

  - id: export_trade_log_archive
    name: "Archive trade log to CSV (week-stamped)"
    description: >
      Write the full trade_log.jsonl contents to
      data/exports/archive/trade_log_<WEEK>.csv.
    command: python3
    args:
      - "-c"
      - |
        import csv, json, sys
        from pathlib import Path
        label    = Path('/tmp/week_label.txt').read_text(encoding='utf-8').strip()
        src      = Path('data/trade_logs/trade_log.jsonl')
        dst      = Path(f'data/exports/archive/trade_log_{label}.csv')
        if not src.exists():
            print("[SKIP] trade_log.jsonl not found.")
            sys.exit(0)
        rows = []
        for line in src.read_text(encoding='utf-8').splitlines():
            if line.strip():
                try:
                    rows.append(json.loads(line))
                except json.JSONDecodeError:
                    pass
        if not rows:
            print("[SKIP] trade_log.jsonl is empty.")
            sys.exit(0)
        fieldnames = list(dict.fromkeys(k for r in rows for k in r))
        dst.parent.mkdir(parents=True, exist_ok=True)
        with dst.open('w', newline='', encoding='utf-8') as fh:
            w = csv.DictWriter(fh, fieldnames=fieldnames, extrasaction='ignore')
            w.writeheader()
            w.writerows(rows)
        print(f"[OK] {dst.name}: {len(rows)} row(s)")
    on_failure: continue

  - id: export_unmatched_archive
    name: "Archive unmatched markets to CSV (week-stamped)"
    description: >
      Write the full unmatched_markets.jsonl contents to
      data/exports/archive/unmatched_<WEEK>.csv.
    command: python3
    args:
      - "-c"
      - |
        import csv, json, sys
        from pathlib import Path
        label = Path('/tmp/week_label.txt').read_text(encoding='utf-8').strip()
        src   = Path('data/trade_logs/unmatched_markets.jsonl')
        dst   = Path(f'data/exports/archive/unmatched_{label}.csv')
        if not src.exists():
            print("[SKIP] unmatched_markets.jsonl not found.")
            sys.exit(0)
        rows = []
        for line in src.read_text(encoding='utf-8').splitlines():
            if line.strip():
                try:
                    rows.append(json.loads(line))
                except json.JSONDecodeError:
                    pass
        if not rows:
            print("[SKIP] unmatched_markets.jsonl is empty.")
            sys.exit(0)
        dst.parent.mkdir(parents=True, exist_ok=True)
        fieldnames = list(dict.fromkeys(k for r in rows for k in r))
        with dst.open('w', newline='', encoding='utf-8') as fh:
            w = csv.DictWriter(fh, fieldnames=fieldnames, extrasaction='ignore')
            w.writeheader()
            w.writerows(rows)
        print(f"[OK] {dst.name}: {len(rows)} row(s)")
    on_failure: continue

  - id: weekly_backtest
    name: "Run backtest and export stamped reports"
    description: >
      Run the backtester on the full edge_history.csv and save equity_curve
      and backtest_report files with the week label in their filenames.
    command: python3
    args:
      - "-c"
      - |
        import sys
        from pathlib import Path
        sys.path.insert(0, '.')
        from src.backtester import Backtester
        label    = Path('/tmp/week_label.txt').read_text(encoding='utf-8').strip()
        csv_path = Path('data/edge_history.csv')
        if not csv_path.exists():
            print("[SKIP] data/edge_history.csv not found.")
            sys.exit(0)
        bt     = Backtester()
        trades = Backtester.load_csv(csv_path)
        if not trades:
            print("[SKIP] No trades in edge_history.csv.")
            sys.exit(0)
        result  = bt.run(trades)
        archive = Path('data/exports/archive')
        archive.mkdir(parents=True, exist_ok=True)
        ec_n  = bt.export_equity_curve(result, archive / f'equity_curve_{label}.csv')
        rep_n = bt.export_report(result,       archive / f'backtest_report_{label}.csv')
        print(f"[OK] equity_curve_{label}.csv: {ec_n} row(s)")
        print(f"[OK] backtest_report_{label}.csv: {rep_n} row(s)")
        print(f"     Trades: {result.n_trades}  "
              f"Win rate: {result.win_rate:.1%}  "
              f"P&L: ${result.total_pnl_usd:+,.2f}  "
              f"ROI: {result.roi_pct:+.2f}%")
    on_failure: continue

  - id: weekly_summary
    name: "Print week-over-week P&L summary"
    description: >
      Read daily_summary.csv, sum the last 7 rows (current week) vs the
      7 rows before that (prior week), and print a compact comparison.
    command: python3
    args:
      - "-c"
      - |
        import csv
        from pathlib import Path
        summary_path = Path('data/exports/daily_summary.csv')
        if not summary_path.exists():
            print("[SKIP] daily_summary.csv not found — run daily-report first.")
            exit(0)
        rows = []
        with summary_path.open(newline='', encoding='utf-8') as fh:
            for row in csv.DictReader(fh):
                rows.append(row)
        if len(rows) < 1:
            print("[SKIP] daily_summary.csv has no data rows.")
            exit(0)

        def week_stats(subset):
            wins  = sum(int(r.get('n_wins',   0)) for r in subset)
            losses= sum(int(r.get('n_losses', 0)) for r in subset)
            pnl   = sum(float(r.get('pnl_usd', 0)) for r in subset)
            total = wins + losses
            wr    = wins / total if total > 0 else float('nan')
            return wins, losses, pnl, wr

        this_week = rows[-7:]
        prev_week = rows[-14:-7] if len(rows) >= 14 else []

        tw = week_stats(this_week)
        print("── Weekly summary ─────────────────────────────────")
        print(f"  This week  : {tw[0]}W / {tw[1]}L  "
              f"WR={tw[3]:.1%}  P&L=${tw[2]:+,.2f}")
        if prev_week:
            pw = week_stats(prev_week)
            delta = tw[2] - pw[2]
            print(f"  Prior week : {pw[0]}W / {pw[1]}L  "
                  f"WR={pw[3]:.1%}  P&L=${pw[2]:+,.2f}")
            print(f"  WoW change : ${delta:+,.2f}")
    on_failure: continue

  - id: rotate_old_logs
    name: "Rotate log entries older than 90 days"
    description: >
      Remove trade_log.jsonl entries timestamped more than 90 days ago.
      The archived CSV created in step 2 serves as the permanent record.
      Skip rotation if the log is small (< 10 MB) to avoid unnecessary I/O.
    command: python3
    args:
      - "-c"
      - |
        import json
        from datetime import datetime, timedelta, timezone
        from pathlib import Path
        log_path = Path('data/trade_logs/trade_log.jsonl')
        if not log_path.exists():
            print("[SKIP] trade_log.jsonl not found.")
            exit(0)
        size_mb = log_path.stat().st_size / (1024 * 1024)
        if size_mb < 10:
            print(f"[SKIP] trade_log.jsonl is only {size_mb:.2f} MB — no rotation needed.")
            exit(0)
        cutoff = datetime.now(tz=timezone.utc) - timedelta(days=90)
        kept   = []
        removed = 0
        for raw in log_path.read_text(encoding='utf-8').splitlines():
            if not raw.strip():
                continue
            try:
                rec = json.loads(raw)
                ts_str = rec.get('timestamp') or rec.get('as_of') or ''
                if ts_str:
                    ts = datetime.fromisoformat(ts_str.replace('Z', '+00:00'))
                    if ts < cutoff:
                        removed += 1
                        continue
            except Exception:
                pass
            kept.append(raw)
        log_path.write_text('\n'.join(kept) + ('\n' if kept else ''),
                            encoding='utf-8')
        print(f"[OK] Rotated {removed} old entries; {len(kept)} remaining.")
    on_failure: continue

notifications:
  on_success: true
  on_failure: true
  success_message: >
    Weekly archive complete.  Stamped reports saved to data/exports/archive/.
  failure_message: >
    Weekly export encountered errors.  Some archive files may be incomplete.
    Check that data directories are writable and Python dependencies are
    installed.
