      status: CLOSED
      resolved_on: 2026-07-21
      verdict: KILL
      resolved_by: >
        The gate's own threshold, reached and failed: 814 fills against 500,
        +5m markout -1.29c/contract fee-net. See the `retired:` block above and
        research/POSTMORTEM_P016_2026-07-21.md.
      question: Positive fee-adjusted +5m markout across a real sample?
      metric: fills
      # Kept as written, deliberately. `maker_fills` never resolved through
      # manager/checks.py::_gate_progress, and the file it names
      # (data/trade_logs/maker_fills.jsonl, 3,700 rows, 814 FILL) is frozen. A
      # closed gate needs no live reader; rewiring one now would be inventing a
      # measurement path for a question already answered.
      source: maker_fills
      threshold: 500
      final_progress: 814
      current_key: pods.P-016.fills_clean
      decision: >
        PRE-REGISTERED: >=500 fills AND positive fee-adjusted +5m markout AND
        robust to excluding the best single day -> else kill.
      exclude_before: "2026-07-20T01:26:00Z"
      exclude_reason: >
        First-night data is anchor-contaminated (restart re-anchored live books
        to current mid, double-counting score -> 484 one-way fills in 45 min).
        Archived to data/trade_logs/contaminated_2026-07-20/ and EXCLUDED from
        the gate. Any fill counter must start after this timestamp or it will
        report a phantom 484-fill head start.
    marginal_result_rule:
      registered: 2026-07-21
      text: >
        PRE-REGISTERED BEFORE THE RESULT IS KNOWN. At ~1,045 fills to detect
        1c at 80% power (per-fill sd 11.54c), the 500-fill gate resolves only
        a ~1.4-1.5c effect. The reading at 282/500 is -1.32c — almost exactly
        at the edge of what the gate can distinguish, so "marginal and
        ambiguous" is the LIKELY outcome at n=500, and that is precisely where
        post-hoc reasoning creeps in. Therefore, decided in advance:
        if the fee-adjusted +5m markout at 500 clean fills lands in
        [-1.5c, 0c] — i.e. negative but not separable from zero — the pod is
        NOT promoted and NOT killed. It EXTENDS to 1,000 clean fills at
        unchanged parameters, one extension only. A second marginal result at
        1,000 is a kill. Positive-and-separable promotes; below -1.5c kills.
    open_questions:
      - id: markout-vs-settlement
        blocked_on: nothing
        resolved: 2026-07-21
        resolution: >
          RESOLVED — keep +5m markout as the gate metric. The trigger itself
          was mis-specified and has been restated (see trigger below).

          The 107 settled positions came from just 5 GAMES. Settlement P&L per
          fill is a deterministic function of one binary outcome, so the
          effective n on the settlement side was 5, not 107 — too small to
          distinguish the hypotheses. Fill-level and game-level estimates of
          the difference disagree in SIGN (+1.005c vs -0.11c), the signature
          of unmodelled clustering; cluster-bootstrap CI [-4.30, +2.68]c
          against a question whose scale is ~1-2c.

          Markout survives on its merits: unbiased as far as measurable (OLS
          slope +1.264, CI [0.94, 1.79] contains 1), directionally informative
          (74.8% sign agreement vs a 50.0% chance baseline; +5m beats +1m's
          51.4%), and ~10x more sample-efficient (per-fill sd 11.54c vs
          35.68c). Settlement is not a viable gate metric at pilot scale.

          Counting FILLS stays valid for markout specifically — a 5-minute
          price move varies within a game, whereas settlement P&L does not.
          The clustering objection applies to settlement, not to markout.

          Trap recorded: settled positions are a biased subset (markout -0.82c
          settled vs -2.25c still-open), so comparing settlement's +0.18c
          against the headline -1.32c manufactures ~1.4c of spurious
          divergence. Only the paired comparison is valid.

          Full analysis: live_agent_research/MARKOUT_VS_SETTLEMENT_2026-07-20.md
        trigger: >
          RESTATED 2026-07-21 (was ">=100 settled maker positions"). The
          original counted the wrong unit — fills, not independent outcomes.
          Any future settlement-vs-markout comparison requires
          >=40 DISTINCT SETTLED GAMES (~8 clean slates at the observed rate),
          which gives ~+/-1c resolution and makes the cluster bootstrap valid.
    watch:
      - divergence-guard pulls (|fair - mid| > 0.15)
      - one-sided fill ratio (the anchor-contamination signature)
      - >
        markout is NEGATIVE (-1.32c over 253 measured fills at 56% of sample).
        Not a verdict — do not act on it — but do not let "not a verdict"
        quietly become optimism either. The marginal_result_rule above exists
        because this is trending toward an ambiguous finish.

