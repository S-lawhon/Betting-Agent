schema_version: 1
enabled: true
mode: execute
worker_id: research-codex-screened-daily-v1
stage_mode: screen_only
budget_scope: screening
status_filename: screening_status.json

# Deliberately NOT exact-target pinned. The pilot config
# (research_agent_runtime_screened_pilot.yaml) fails closed on one reviewed
# assignment and stays the tool for a supervised one-off. This one works the
# top of the queue so the pipeline advances without a human naming a target.
#
# There is no enable marker either: for a recurring unit the marker is not a
# safety property, it is a lie. Nobody is present to place it, so a marker
# would either be created by the unit itself (meaningless) or left permanently
# on disk (meaningless). The real fuses are below and they are all mechanical:
#   - one packet per invocation, six scheduled invocations per day
#   - six screening attempts per UTC day, hard, checked before any claim
#   - screening first, deep research only if the screen survives
#   - trading execution disabled, queue mutation disabled
#   - the audit runs immediately after and fails the unit on a bad outcome

# All three scout lanes, each behind the screen (screening.agents below must
# cover every agent here -- the worker refuses to start otherwise, because an
# allowed-but-unscreened agent would route straight to the expensive
# deep-research call). Queue order across lanes is priority, then triage
# score, then age; packets for agents outside this list are SKIPPED, not
# blocked on -- see research_execution.
allowed_agents:
  - strategy-scout
  - literature-scout
  - social-scout

limits:
  max_minutes_per_task: 30
  timeout_seconds: 600
  # 250k, authorised by Sam 2026-08-09, and it is NOT a spend limit.
  #
  # Codex reports input tokens cumulatively across its internal turns, so a
  # deep-research pass costs far more than the packet it was handed. Measured
  # across every deep call to date: 36,868 / 69,197 / 74,134 / 78,700 / 88,948
  # / 111,426 / 202,807. The previous 75,000 sat near the 30th percentile and
  # rejected four of seven.
  #
  # The rejection happens AFTER the provider returns, so a breach cannot
  # prevent the spend -- it only discards work already paid for, releases the
  # claim, and leaves the same packet to be retried and fail identically the
  # next day. That happened on 2026-08-03 (78,700) and again on 2026-08-09
  # (111,426). Metered cost is $0.00 on every run (chatgpt_subscription).
  #
  # The real runaway guards are max_attempts_per_day and timeout_seconds; both
  # are unchanged. Do not "tighten" this back without re-reading the measured
  # distribution above -- a cap below the tail is not a safety property, it is
  # a daily failure.
  max_input_tokens_per_task: 250000
  max_output_tokens_per_task: 5000
  max_cost_usd_per_task: 0.01
  # One-week throughput trial, 2026-08-16 through 2026-08-23. Intake produced
  # six new dispatches in the measured prior 24h, so the five-screen budget
  # could not keep up even before considering the inherited backlog.
  max_cost_usd_per_day: 0.06
  max_attempts_per_day: 6
  max_output_bytes: 150000

retry:
  base_cooldown_minutes: 180
  max_cooldown_minutes: 1440
  max_failures: 3

provider:
  type: command
  name: openai-codex-pro
  model: gpt-5.6-luna
  billing_mode: chatgpt_subscription
  argv:
    - /opt/betting-pod-shop/venv/bin/python
    - /opt/betting-pod-shop/scripts/codex_research_provider.py
    - --model
    - gpt-5.6-luna
    - --schema
    - /opt/betting-pod-shop/config/research_agent_output.schema.json
    - --workspace
    - /var/lib/research-codex/workspace
    - --timeout-seconds
    - "540"
  pass_env:
    - CODEX_HOME
    - HOME

screening:
  enabled: true
  # Must be a superset of allowed_agents above. Omitting this key defaults to
  # strategy-scout only (the pinned pilot config relies on that default).
  agents:
    - strategy-scout
    - literature-scout
    - social-scout
  limits:
    timeout_seconds: 180
    max_input_tokens: 25000
    max_output_tokens: 1000
    max_cost_usd: 0.01
    max_output_bytes: 32000
  provider:
    type: command
    name: openai-codex-pro-screen
    model: gpt-5.6-luna
    billing_mode: chatgpt_subscription
    argv:
      - /opt/betting-pod-shop/venv/bin/python
      - /opt/betting-pod-shop/scripts/codex_research_provider.py
      - --model
      - gpt-5.6-luna
      - --schema
      - /opt/betting-pod-shop/config/research_screen_output.schema.json
      - --workspace
      - /var/lib/research-codex/workspace
      - --timeout-seconds
      - "150"
      - --disable-search
      - --reasoning-effort
      - low
    pass_env:
      - CODEX_HOME
      - HOME

safety:
  trading_execution_allowed: false
  queue_mutation_in_dry_run: false
  service_mutation_allowed: false
  secrets_allowed_in_output: false
