# ── Betting Agent — Default Configuration ─────────────────────────────────────
# Override any value via environment variable (see .env.example).
# Secrets (API keys, tokens) MUST live in .env — never here.

environment: demo           # demo | live  (live requires executor gate)
log_level: INFO             # DEBUG | INFO | WARNING | ERROR
scan_interval_seconds: 60   # 1 minute between scans (5M req/month plan — uses ~216K req/month)

# ── Kalshi ────────────────────────────────────────────────────────────────────
kalshi:
  base_url: https://api.elections.kalshi.com/trade-api/v2
  max_pages: 20                 # pagination pages per scan cycle (200 markets/page = 4,000 markets total)
  rate_limit:
    requests_per_second: 5
    burst: 10
  retry:
    max_attempts: 4
    backoff_base_seconds: 1.0   # doubles each attempt

# ── Odds API ─────────────────────────────────────────────────────────────────
odds_api:
  base_url: https://api.the-odds-api.com/v4
  cache_ttl_seconds: 60         # 1-minute cache — matches scan interval for fresh data
  priority_books:               # order matters — Pinnacle weighted highest
    - pinnacle
    - draftkings
    - fanduel
    - betmgm
  sports:                       # restrict to these sport keys
    # americanfootball_nfl      # NFL season over — re-enable in Sep
    - basketball_nba            # NBA regular season
    - basketball_ncaab          # NCAA Men's Basketball (March Madness season)
    # - basketball_ncaaw        # not a valid Odds API key — returns 404
    # baseball_mlb              # MLB opens late Mar — re-enable then
    - baseball_ncaa             # NCAA College Baseball (Spring season)
    - icehockey_nhl             # NHL regular season
    # - icehockey_ncaa          # not a valid Odds API key — returns 404
    - tennis_atp_qatar_open     # ATP Qatar Open (active Feb)
    - tennis_atp_dubai          # ATP Dubai (active Feb)
    - tennis_wta_dubai          # WTA Dubai Championships (active Feb)
    - tennis_wta_qatar_open     # WTA Qatar Open (active Feb)
    - tennis_wta_indian_wells   # WTA Indian Wells (Mar)
    - tennis_wta_miami_open     # WTA Miami Open (Mar–Apr)
    # WTA Austin / Delray Beach / Metepec / Merida — not in Odds API (no sportsbook coverage)

# ── Risk Manager ─────────────────────────────────────────────────────────────
risk:
  max_positions: 50             # open positions at any one time (raised from 10 for multi-pod operation)
  max_exposure_pct: 0.20        # 20% of bankroll across all open bets
  max_daily_loss_pct: 0.05      # 5% daily loss triggers cooldown
  cooldown_minutes: 60          # pause after max_daily_loss breach
  kelly_fraction: 0.25          # fractional Kelly (quarter Kelly)
  base_bet_pct: 0.03            # bet cap at normal edge levels (≤ high_edge_threshold)
  max_bet_pct: 0.06             # bet cap ceiling for very-high-edge opportunities
  high_edge_threshold: 0.10     # edge at which cap begins scaling above base_bet_pct
  max_edge_threshold: 0.25      # edge at which cap reaches max_bet_pct ceiling
  min_confidence: 0.55          # minimum model confidence to trade

# ── Edge / EV Filters ────────────────────────────────────────────────────────
edge:
  min_edge_pct: 0.03            # minimum edge (3%) to surface opportunity
  min_ev: 0.01                  # minimum expected value per dollar risked
  fee_pct: 0.07                 # Kalshi platform fee (7% of winnings)

# ── Liquidity Filter ──────────────────────────────────────────────────────────
liquidity:
  min_market_volume: 500        # minimum total contracts traded on a market
                                # (use volume_24h or open_interest instead if
                                #  you want to track real-time depth rather than
                                #  all-time price discovery)

# ── Fatigue Arbitrage (Strategy 1 — schedule-adjusted edge confidence) ──────
fatigue:
  enabled: true                         # toggle fatigue analysis on/off
  sports:                               # only analyze fatigue for these sports
    - basketball_nba
    - basketball_ncaab
  schedule_cache_path: data/schedule_cache.jsonl
  b2b_multiplier: 1.5                  # edge threshold multiplier for back-to-back games
  rest_diff_multiplier: 1.3             # multiplier when rest differential ≥ min_rest_diff
  min_rest_diff: 2                      # minimum rest-day difference to trigger signal
  b2b_threshold_hours: 28               # hours between games to flag as back-to-back

# ── Consistency Arbitrage (Strategy 2 — cross-tier probability) ───────────────
consistency:
  enabled: true
  sports:
    - basketball_nba
  series_tickers:
    game: KXNBAGAME
    playoff: KXNBAPLAYOFF
    conference_east: KXNBAEAST
    conference_west: KXNBAWEST
    championship: KXNBA
  min_divergence: 0.05          # 5% inconsistency threshold to flag signal
  min_game_markets: 3           # need ≥ 3 upcoming game markets for reliable estimate
  min_volume: 200               # per-market volume floor for consistency check
  max_conditional_finals_prob: 0.75   # P(win finals | won conference) cap
  log_path: data/trade_logs/consistency_log.jsonl

# ── Matcher ──────────────────────────────────────────────────────────────────
matcher:
  fuzzy_threshold: 60           # combined title match threshold (0-100)
  min_team_score: 50            # each team must score ≥ this individually against the Kalshi title
                                # prevents one-team partial matches (e.g. SAS-DET matching SAS-SAC)
  time_window_minutes: 43200    # 30 days — Kalshi open_time is ~14 days before game

# ── Learner (Phase 10) ───────────────────────────────────────────────────────
learner:
  enabled: false
  min_trades_for_adjustment: 200
  max_adjustment_pct: 0.03      # cap calibration shifts at ±3%
  model_state_path: data/model_state.json

# ── Paths ────────────────────────────────────────────────────────────────────
paths:
  trade_log: data/trade_logs/trade_log.jsonl
  unmatched_log: data/trade_logs/unmatched_markets.jsonl
  edge_history: data/edge_history.csv
  model_state: data/model_state.json
