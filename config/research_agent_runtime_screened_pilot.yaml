schema_version: 1
enabled: true
mode: execute
worker_id: research-codex-screened-pilot-v1

# One-time fail-closed target. If this exact reviewed assignment is not
# pending, the worker exits blocked and invokes no provider. Re-pinned
# 2026-08-14 to the defer-with-null-recheck failure for a supervised same-day
# retry under the c8a03f3 contract fix.
target_assignment_id: assignment_0c5bb6106a1add3dfcba

allowed_agents:
  - strategy-scout

# One assignment can consume two attempts: screen, then deep research only if
# the screen survives. This config admits one assignment per UTC day.
#
# max_attempts_per_day is 4, not 2, because the attempt ledger is GLOBAL per
# state_dir per UTC day (_daily_usage reads every run record for the date,
# not just this worker's): a supervised same-day retry after a failed daily
# run must reserve 2 on top of the 2 the failure already consumed. This is
# safe ONLY because this config is human-triggered with a pinned target and
# one packet per invocation — never copy the 4 into the unattended daily
# config, whose 2 is the real runaway guard.
#
# max_input_tokens_per_task matches the daily config's 250k: the old 75k sat
# near the 30th percentile of measured deep passes and rejected 4 of 7 — and
# the check fires only after the spend, so a low cap is not a guard, it is a
# way to discard paid work.
limits:
  max_minutes_per_task: 30
  timeout_seconds: 600
  max_input_tokens_per_task: 250000
  max_output_tokens_per_task: 5000
  max_cost_usd_per_task: 0.01
  max_cost_usd_per_day: 0.04
  max_attempts_per_day: 4
  max_output_bytes: 150000

retry:
  base_cooldown_minutes: 60
  max_cooldown_minutes: 240
  max_failures: 3

provider:
  type: command
  name: openai-codex-pro
  model: gpt-5.6-luna
  billing_mode: chatgpt_subscription
  argv:
    - /opt/betting-pod-shop/venv/bin/python
    - /opt/betting-pod-shop/scripts/codex_research_provider.py
    - --model
    - gpt-5.6-luna
    - --schema
    - /opt/betting-pod-shop/config/research_agent_output.schema.json
    - --workspace
    - /var/lib/research-codex/workspace
    - --timeout-seconds
    - "540"
  pass_env:
    - CODEX_HOME
    - HOME

screening:
  enabled: true
  limits:
    timeout_seconds: 180
    max_input_tokens: 25000
    max_output_tokens: 1000
    max_cost_usd: 0.01
    max_output_bytes: 32000
  provider:
    type: command
    name: openai-codex-pro-screen
    model: gpt-5.6-luna
    billing_mode: chatgpt_subscription
    argv:
      - /opt/betting-pod-shop/venv/bin/python
      - /opt/betting-pod-shop/scripts/codex_research_provider.py
      - --model
      - gpt-5.6-luna
      - --schema
      - /opt/betting-pod-shop/config/research_screen_output.schema.json
      - --workspace
      - /var/lib/research-codex/workspace
      - --timeout-seconds
      - "150"
      - --disable-search
      - --reasoning-effort
      - low
    pass_env:
      - CODEX_HOME
      - HOME

safety:
  trading_execution_allowed: false
  queue_mutation_in_dry_run: false
  service_mutation_allowed: false
  secrets_allowed_in_output: false
