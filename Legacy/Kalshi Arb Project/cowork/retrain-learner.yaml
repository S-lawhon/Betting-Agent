---
# cowork/retrain-learner.yaml
# ──────────────────────────────────────────────────────────────────────────────
# Automation: Retrain the logistic-regression probability calibrator.
#
# What it does
# ────────────
#   1. Checks that data/model_state.json exists and has enough resolved trades
#      to warrant retraining (configurable threshold, default 200).
#   2. Loads the Learner from the persisted state, calls learner.train(), and
#      saves the updated weights back to model_state.json.
#   3. Prints a before/after summary: global bias, logistic weights, and the
#      last-trained trade count.
#   4. Optionally back-tests calibration quality by replaying
#      edge_history.csv with the new adjusted probabilities and comparing
#      the calibration error (Brier score) before and after.
#
# Scheduling
# ──────────
#   On demand (manual trigger) — run after a meaningful batch of new resolved
#   trades has accumulated.  An optional weekly schedule is provided and can
#   be uncommented when sufficient trade volume is expected.
#
# Note: Retraining is a no-op if n_resolved < min_trades_for_adjustment
#       (set in config.yaml learner.min_trades_for_adjustment, default 200).
# ──────────────────────────────────────────────────────────────────────────────

name: retrain-learner
display_name: "Retrain Probability Calibrator"
description: >
  Load the rolling Learner model from data/model_state.json, re-fit the
  logistic regression on the current rolling window of resolved trades, and
  save the updated weights.  Prints a before/after calibration summary.
  Requires at least min_trades_for_adjustment (default 200) resolved records.
version: "1.0"
category: ml

trigger:
  type: manual
  # Uncomment the lines below to also run on a weekly schedule once you have
  # sufficient trade volume:
  # type: scheduled
  # cron: "0 6 * * 1"    # 6:00 am every Monday
  # timezone: local

environment:
  working_directory: "."
  python_executable: python3
  required_files:
    - config.yaml
    - src/learner.py

steps:
  - id: check_state
    name: "Check model_state.json has enough records"
    description: >
      Read the state file and confirm there are at least min_trades records
      before attempting to retrain.  Exit with a friendly message if not.
    command: python3
    args:
      - "-c"
      - |
        import json, sys, yaml
        from pathlib import Path

        cfg = yaml.safe_load(Path('config.yaml').read_text(encoding='utf-8'))
        min_trades = cfg.get('learner', {}).get('min_trades_for_adjustment', 200)
        state_path = Path(cfg.get('learner', {}).get('model_state_path',
                                                      'data/model_state.json'))

        if not state_path.exists():
            print(f"[SKIP] {state_path} not found.")
            print("       The agent needs to run paper-mode cycles and resolve"
                  " trades before the learner can be trained.")
            sys.exit(0)

        state = json.loads(state_path.read_text(encoding='utf-8'))
        n = len(state.get('records', []))
        print(f"  Records in rolling window : {n}")
        print(f"  Minimum for retraining    : {min_trades}")
        if n < min_trades:
            print(f"[SKIP] Not enough records yet ({n} < {min_trades}).")
            sys.exit(0)
        print("[OK] Sufficient records — proceeding to retrain.")
    on_failure: abort

  - id: print_before_stats
    name: "Print current calibration stats (before retraining)"
    description: >
      Show the existing weights and bias so the user can compare before and
      after retraining.
    command: python3
    args:
      - "-c"
      - |
        import json, yaml
        from pathlib import Path

        cfg = yaml.safe_load(Path('config.yaml').read_text(encoding='utf-8'))
        state_path = Path(cfg.get('learner', {}).get('model_state_path',
                                                      'data/model_state.json'))
        state = json.loads(state_path.read_text(encoding='utf-8'))
        records = state.get('records', [])
        weights = state.get('logistic_weights')
        last_n  = state.get('last_trained_n', 0)

        outcomes   = [r['outcome']   for r in records]
        fair_probs = [r['fair_prob'] for r in records]
        n = len(records)
        bias = sum(outcomes)/n - sum(fair_probs)/n if n else 0.0

        print("── Before retraining ─────────────────────────────")
        print(f"  n_records       : {n}")
        print(f"  last_trained_n  : {last_n}")
        print(f"  global_bias     : {bias:+.4f}")
        if weights:
            print(f"  logistic_weights: {[round(w, 6) for w in weights]}")
        else:
            print("  logistic_weights: None (bias-only mode)")
    on_failure: continue

  - id: retrain
    name: "Retrain logistic regression model"
    description: >
      Instantiate the Learner from config, load persisted state, call
      learner.train() to re-fit the gradient descent model on the full
      rolling window, and save the updated weights to model_state.json.
    command: python3
    args:
      - "-c"
      - |
        import sys, yaml
        from pathlib import Path
        sys.path.insert(0, '.')
        from src.learner import Learner

        cfg = yaml.safe_load(Path('config.yaml').read_text(encoding='utf-8'))
        # Force enabled=True for the retrain step so train() runs even if
        # the learner is disabled in paper-mode production.
        lc = cfg.get('learner', {})
        cfg_override = dict(cfg)
        cfg_override['learner'] = dict(lc, enabled=True)

        learner = Learner.from_config(cfg_override)
        if learner.n_resolved == 0:
            print("[SKIP] Learner has no records after load.")
            sys.exit(0)

        trained = learner.train()
        if not trained:
            print("[SKIP] train() returned False (insufficient records).")
            sys.exit(0)

        saved = learner.save()
        if saved:
            print(f"[OK] Model retrained on {learner.n_resolved} records and saved.")
        else:
            print("[WARN] Model retrained but save() failed — check file permissions.")
    on_failure: abort

  - id: print_after_stats
    name: "Print updated calibration stats (after retraining)"
    description: >
      Show the new weights and global bias so the user can see the impact
      of retraining.
    command: python3
    args:
      - "-c"
      - |
        import json, sys, yaml
        from pathlib import Path
        sys.path.insert(0, '.')
        from src.learner import Learner

        cfg = yaml.safe_load(Path('config.yaml').read_text(encoding='utf-8'))
        lc  = cfg.get('learner', {})
        cfg_override = dict(cfg)
        cfg_override['learner'] = dict(lc, enabled=True)
        learner = Learner.from_config(cfg_override)
        stats   = learner.stats()

        print("── After retraining ──────────────────────────────")
        print(f"  n_resolved      : {stats['n_resolved']}")
        print(f"  last_trained_n  : {stats['last_trained_n']}")
        print(f"  global_bias     : {stats['global_bias']:+.4f}")
        print(f"  model active    : {stats['trained']}")
        if stats.get('logistic_weights'):
            w = stats['logistic_weights']
            print(f"  weights         : fair_prob={w[0]:+.6f}  "
                  f"edge_pct={w[1]:+.6f}  bias={w[2]:+.6f}")
        if stats.get('by_sport'):
            print("  Per-sport bias:")
            for sp, b in sorted(stats['by_sport'].items()):
                print(f"    {sp:<20s}: {b:+.4f}")
    on_failure: continue

  - id: brier_score
    name: "Compute Brier score (calibration quality check)"
    description: >
      Calculate the mean squared error between fair_prob and outcome
      (Brier score) with and without calibration adjustment.  Lower is better.
      A well-calibrated model should reduce the Brier score.
    command: python3
    args:
      - "-c"
      - |
        import json, sys, yaml
        from pathlib import Path
        sys.path.insert(0, '.')
        from src.learner import Learner

        cfg = yaml.safe_load(Path('config.yaml').read_text(encoding='utf-8'))
        lc  = cfg.get('learner', {})
        cfg_override = dict(cfg)
        cfg_override['learner'] = dict(lc, enabled=True)
        learner = Learner.from_config(cfg_override)

        records = learner._records
        if not records:
            print("[SKIP] No records for Brier score computation.")
            sys.exit(0)

        # Brier score WITHOUT calibration (raw fair_prob)
        brier_raw = sum((r['fair_prob'] - r['outcome'])**2 for r in records) / len(records)

        # Brier score WITH calibration (adjusted probabilities)
        brier_adj = sum(
            (learner.adjust_prob(r['fair_prob'], r['edge_pct'], r.get('sport')) - r['outcome'])**2
            for r in records
        ) / len(records)

        improvement = brier_raw - brier_adj
        print(f"── Brier score (lower = better) ──────────────────")
        print(f"  Raw fair_prob  : {brier_raw:.6f}")
        print(f"  Calibrated     : {brier_adj:.6f}")
        print(f"  Improvement    : {improvement:+.6f}  "
              f"({'better' if improvement > 0 else 'worse' if improvement < 0 else 'no change'})")
    on_failure: continue

notifications:
  on_success: true
  on_failure: true
  success_message: >
    Learner retrained successfully.  Updated weights saved to
    data/model_state.json.  Calibration stats printed above.
  failure_message: >
    Learner retraining failed.  Check that model_state.json is readable,
    config.yaml is valid, and numpy is installed.
