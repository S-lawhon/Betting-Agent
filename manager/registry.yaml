# =============================================================================
# KNOWN BENIGN NOISE — suppress these so real signal stays visible.
# An alerting system that cries wolf every 5 minutes gets muted, and then it
# protects nothing. Each entry needs a reason and ideally an expiry.
# =============================================================================
suppress:
  - pattern: "HTTP 404: Unknown sport"
    match: "basketball_ncaaw"
    reason: >
      CORRECTED 2026-07-21 — the original reason ("out of season") was wrong,
      and acting on it would have produced a fix that failed in November.
      The Odds API returns "HTTP 404: Unknown sport" for basketball_ncaaw: it
      is rejecting the sport KEY as invalid, not reporting an empty in-season
      result. A valid-but-idle sport returns 200 with zero events. Measured at
      1,164 occurrences in 24h on the droplet, once per 5-min cycle.
    fix: >
      DONE (locally) 2026-07-21: basketball_ncaaw commented out of
      odds_api.sports in config_multi_pod.yaml. Season-date gating was
      considered and rejected — the key is invalid year-round, so gating would
      have masked the noise until NCAAW season opened and then resumed 404ing.
      NEEDS DEPLOY: the droplet still runs the old config and will keep
      emitting this until scripts/deploy.sh runs. Keep this suppression until
      then. To genuinely re-enable NCAAW, confirm the real key via /v4/sports.
    expires: 2026-11-01   # re-evaluate if a valid NCAAW key is identified

  - pattern: "SANITY_SKIP"
    reason: >
      P-006 skips 5-11 markets/cycle where Polymarket mid diverges 0.25-0.41
      from fair. The pod's own message calls it a probable mapping error. This
      is the guard WORKING, not failing — but the underlying mapping bug is real
      and tracked under P-006.watch. Alert on RATE CHANGE, not presence.
    alert_on: rate_change
