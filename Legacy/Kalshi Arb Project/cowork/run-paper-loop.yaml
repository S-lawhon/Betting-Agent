---
# cowork/run-paper-loop.yaml
# ──────────────────────────────────────────────────────────────────────────────
# Automation: Run one paper-mode scan cycle of the betting agent.
#
# What it does
# ────────────
#   1. Verifies the .env file is present and non-empty.
#   2. Runs `python -m src.main` from the project root (paper / demo mode).
#   3. Tails the latest log entry and surfaces any WARNING / ERROR lines.
#   4. Emits a short status summary (startup_ok, edges found, orders placed).
#
# Scheduling
# ──────────
#   Every 5 minutes during typical US sports-market hours (8 am – midnight local
#   time).  Adjust the cron expression or disable in off-season periods.
#
# Safety gates
# ────────────
#   • The agent will NOT place live orders unless config.yaml `environment`
#     is set to "live" AND the .env file contains `I_UNDERSTAND_LIVE_TRADING=true`.
#   • If the daily loss breaker has fired, the agent exits cleanly and logs
#     `shutdown_cooldown`.
# ──────────────────────────────────────────────────────────────────────────────

name: run-paper-loop
display_name: "Run Paper Trading Scan"
description: >
  Execute one full scan-and-decide cycle of the betting agent in paper (demo)
  mode.  Compares Kalshi implied probabilities against The Odds API fair values,
  sizes any qualifying edges via Kelly, records them to edge_history.csv, and
  updates the trade log — without placing real money.
version: "1.0"
category: trading

trigger:
  type: scheduled
  cron: "*/5 8-23 * * *"   # every 5 min, 8 am – 11:55 pm local time
  timezone: local           # cron runs in the user's machine timezone

environment:
  working_directory: "."          # project root
  python_executable: python3
  required_files:
    - .env
    - config.yaml
    - src/main.py

steps:
  - id: preflight
    name: "Pre-flight: verify environment"
    description: >
      Confirm .env exists and contains the three required secrets
      (KALSHI_EMAIL, KALSHI_PASSWORD, ODDS_API_KEY).  Abort with a clear
      message if any are missing so the user is not left guessing.
    command: python3
    args:
      - "-c"
      - |
        import os, sys
        from pathlib import Path
        from dotenv import load_dotenv
        load_dotenv(Path('.env'), override=False)
        missing = [k for k in ('KALSHI_EMAIL','KALSHI_PASSWORD','ODDS_API_KEY')
                   if not os.environ.get(k)]
        if missing:
            print(f"[ABORT] Missing secrets in .env: {', '.join(missing)}")
            sys.exit(1)
        print("[OK] Secrets present")
    on_failure: abort

  - id: run_agent
    name: "Run one scan cycle"
    description: >
      Launch the agent entry point.  In paper mode this logs `startup_ok`,
      scans open Kalshi markets, fetches Odds API prices, scores edges, sizes
      positions, and exits cleanly.
    command: python3
    args: ["-m", "src.main"]
    on_failure: notify

  - id: tail_logs
    name: "Surface warnings and errors from the latest run"
    description: >
      Read the most recent structured log entries and print any lines whose
      level is WARNING or above so the user can act without digging into raw
      JSON logs.
    command: python3
    args:
      - "-c"
      - |
        import json, sys
        from pathlib import Path
        log_path = Path('data/trade_logs/trade_log.jsonl')
        if not log_path.exists():
            print("[INFO] No trade log yet — agent may not have found edges.")
            sys.exit(0)
        lines = log_path.read_text(encoding='utf-8').splitlines()[-50:]
        bad = [l for l in lines if '"level":"warning"' in l.lower()
                                or '"level":"error"' in l.lower()]
        if bad:
            print(f"[WARN] {len(bad)} warning/error line(s) in last 50 log entries:")
            for l in bad:
                try:
                    d = json.loads(l)
                    print(f"  [{d.get('level','?').upper()}] {d.get('event','?')}")
                except Exception:
                    print(f"  {l}")
        else:
            print("[OK] No warnings or errors in the last 50 log entries.")
    on_failure: continue   # log tail is best-effort

notifications:
  on_success: false        # silent on a clean scan
  on_failure: true         # alert if the agent crashes or preflight fails
  failure_message: >
    Betting agent scan cycle failed.  Check that .env secrets are set and
    config.yaml is valid.  See logs in data/trade_logs/ for details.
