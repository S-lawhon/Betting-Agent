    summary: >
      RETIRED 2026-07-21 — failed its pre-registered gate (negative +5m
      markout). Kalshi MLB in-game home-YES market making, innings 1-8,
      settle-don't-trade-out. See retired: block and the post-mortem.
    gate:
      # CLOSED 2026-07-28. This gate is not pending — it RESOLVED, and killing
      # P-016 is what it did. It sat here with `source: maker_fills` and no
      # reader, which the 2026-07-29 instrumentation standard correctly flagged
      # as P-014's exact defect. The defect was real but the diagnosis was
      # inverted: P-014's gate was unreadable and STILL COUNTING; this one had
