    contamination_warning: >
      EVERY close-anchored T-1h sports result in 03_validation.md carries the same
      methodology risk (UFC MOV, WC props cheap-side, pooled props tables) and is
      UNVERIFIED until re-run with event-start anchoring. Always anchor to
      scheduled event start, never to close.
    gate:
      # Build 2 (weather) is the live one — the 5 Mac cron jobs feed it.
      question: Build 2 weather maker — is it capturing real edge?
      decision: >
        30 days live across >=10 cities, realized maker ROI > +5%/week on
        deployed collateral, and adverse selection (post-fill drift) measured at
        less than half of captured edge.
      metric: days_live
      threshold: 30
    open_questions:
      - id: build3-gate
        blocked_on: data
        text: >
          Build 3 needs 2 weeks of websocket quote capture measuring fill rates
          at +/-1c around Poly mid, post-fill adverse selection, and effective
          spread capture. If capture < 1c/contract after adverse selection, stop
