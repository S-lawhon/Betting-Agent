  - id: R-MLB-PROPS
    name: MLB Props Research (Phase 3)
    stage: build
    owner_dir: mlb_props_research
    blocked_on: time
    action_required: >
      PHASE 3 COMPLETE 2026-07-20 with two NEGATIVE results (PHASE3_REPORT.md).
      Next step is a live paper EXECUTION test, NOT more modelling: every edge so
      far was measured against trade prints, never against a live book. Must
      measure whether fills are actually available at the ask near first pitch,
      using the collector orderbook snapshots in mlb_props_research/data/live/.

      BLOCKED ON DATA UNTIL ~2026-08-17 — do not run the execution test before
      then. PHASE3_REPORT.md:115 is explicit that the existing 2-day / 170-market
      Test A is badly underpowered and must NOT be read as a refutation; running
      it again on the same thin sample would only relaunder that error. See
      collection_status below. Nothing is required of a human until the sample
      lands; the standing decision (does ~$10-35/day justify the build) is then
      taken against a properly powered result.
    collection_status:
      script: mlb_props_research/collector.py
      unit: mlb-props-collector.timer -> .service (droplet, 10:00 ET daily)
      data_path: /opt/mlb-props/mlb_props_research/data/live/snapshots_YYYYMMDD.jsonl
      started: 2026-07-21
      game_days_collected: 3      # 07-19, 07-20, 07-21 — verified by ET bucket
      game_days_target: 27
      expected_complete: 2026-08-17   # +/- rainouts and off-days
      consolidated: >
        All data now lives on the droplet at the data_path above. The two
        historical Mac runs were copied 2026-07-21 as
        snapshots_20260719_mac.jsonl / snapshots_20260720_mac.jsonl — suffixed
        so they cannot clobber the droplet's own 07-20 sliver, and picked up by
        any snapshots_*.jsonl glob. Safe to merge because every record carries
        a UTC `ts`, so the FILENAME is a convenience and analysis can re-bucket
        at will. Verified after the copy: 3 distinct ET game-days present.
      truncation_bug_fixed: >
        FOUND AND FIXED 2026-07-21, and it was silently losing ~45% of the
        thing the study measures. collector.py used a naive datetime.now() for
        BOTH the stop condition and the output filename, so it inherited the
        host timezone. end_hour=23.75 therefore meant 23:45 CT on the Mac
        (full slate) but 23:45 UTC on the droplet — which is 19:45 ET.
        Measured against an 11-start-slot board (1840..2140 ET), that quit
        before first pitch for 5 of 11 slots, every West Coast game among
        them. The execution test this feeds is specifically about fill
        availability NEAR FIRST PITCH, so the truncation biased exactly the
        measurement it exists to make, and the lost windows are unrecoverable.
        Fix: anchor both to America/New_York via zoneinfo, with a loud warning
        if tzdata is missing (the silent fallback IS the bug). Redeployed and
        restarted 2026-07-21 ~20:15 UTC; the run now covers to 23:45 ET.
        CONSEQUENCE FOR ANALYSIS: 07-21 data before ~20:15 UTC was collected
        under the truncated window. Treat 07-22 onward as the first clean
        full-slate days, and check per-day coverage before pooling.
      note: >
        CORRECTION 2026-07-21: the timer was installed at 03:00 UTC 2026-07-21
        and first fired at 14:00 UTC that day, so any claim of a droplet timer
        "accumulating" before 2026-07-21 is wrong — 07-19 and 07-20 were manual
        local runs. Day count is calendar-bound, not throughput-bound: a missed
        day is a game-day that never comes back, hence Persistent=true on the
        timer and Restart=on-failure on the service.

        The collector was also unthrottled until 2026-07-21: it burst at the
        client default 4.5 req/s for 123s of every 300s cycle. Kalshi throttles
        on shared per-IP rate, and betting-book-capture (the only consumer that
        logs 429s explicitly) went from zero 429s all day to 7 within hours of
        the collector starting, self-throttling 2.5 -> 1.25 req/s. Collector now
        runs --rate 2.0, which spreads the same ~570 requests across the full
        cycle: same throughput, peak cut 56%.
    summary: >
      Phase 3 killed two things. (1) The batter-hits model FAILS: well calibrated
      in isolation but loses to market on Brier (0.2236 vs 0.2210) at every
      strike, with NEGATIVE selection value — bets it liked returned +7.73c,
      bets it said to AVOID returned +9.04c. Public box-score aggregates carry no
      information Kalshi prices lack. Model shelved. (2) Phase 2's +8.5c was
      STALE-PRICE INFLATED — entry priced at last pregame trade, which in thin
      prop books is hours old. Edge grows with staleness (>8h: +19.7c) but drift
      is ~zero, so it was measuring uncontested books, not mispricing. Honest
      tradeable number on fresh entries (<=30m): +5.55c IS / +3.66c OOS at 1.5c
      cost — positive in both windows but DECLINING.
    gate:
      question: Are fills actually available at the ask near first pitch?
      decision: >
        CAPACITY IS THE BINDING CONSTRAINT, not edge. Median qualifying market
        trades only 86 contracts in the final 30 min (~$4.30 theoretical edge at
        5c). Realistic capture 5-15% of ~447k contracts/90d = ~$10-35/day — far
        below Phase 1's "low hundreds/day" projection. Gate before real capital
        is a live paper execution test against real book depth.
    open_questions:
      - id: websocket-capture
        blocked_on: time
        text: >
          COLLECTION STARTED 2026-07-21. Sizing the repricing-lag edge needs
          1-minute or websocket book capture for a two-week window; 5-minute
          sampling is underpowered. This is no longer unscheduled — the
          betting-book-capture systemd unit is live on the droplet writing
          data/book_capture/ at 60s cadence.

          REST polling, not websocket, and that is a constraint not a shortcut:
          Kalshi's websocket requires PRODUCTION API credentials and this
          project holds demo-only keys (.env KALSHI_ENVIRONMENT=demo), so demo
          carries no real book data. The on-disk schema is websocket-shaped
          (rows keyed by ticker+epoch) so an authenticated feed could later
          write the same records with no migration.

          COVERAGE CAVEAT — do not read the capture as complete. It runs at
          2.5 req/s, which caps it at 45 markets and truncates ~23 of ~68
          discovered (lowest 24h volume first, mostly next-day games). Each
          truncation is logged AND written into the data as a DISCOVERY record,
          so analysis can see the gap rather than assume full coverage. The
          rate was set conservatively during the 429 investigation; now that
          the root cause is fixed (kalshi.rate_limit 5->2), it can be raised
          toward 5.0 req/s to cover the full slate — check the unit's 429
          count first.
        started: 2026-07-21
        eta: two weeks of capture -> ~2026-08-04
        build_notes: research/BOOK_CAPTURE_2026-07-20.md
    note: >
      NEVER use last_price for calibration — it is settlement-contaminated.
      Use pregame trade prices.

