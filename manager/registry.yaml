    open_questions:
      - id: mlb-maker-fee
        blocked_on: external
        text: >
          Confirm whether the 2026-07-07 Kalshi fee schedule puts MLB series on
          the maker-fee list. Changes P-016 economics by 0.44c/contract. Currently
          assuming the conservative 0.0175 coefficient.
      - id: polymarket-us-api
        blocked_on: external
        text: Determine Polymarket US API availability (relaunched Dec 2025, 49 states).
      - id: inplay-basis
        blocked_on: data
        text: Log in-play Kalshi-vs-Polymarket basis for a few weeks.

  - id: R-TENNIS
    name: Tennis Research / P-015b lower tour
    stage: research
    owner_dir: tennis_research
    blocked_on: human
    summary: >
      ANALYSIS COMPLETE. analyze_lower_tour.py finished 2026-07-20 21:07;
      results in tennis_research/lower_tour_results.txt. The P-015 tour-level
      qualifier edge does NOT replicate out of sample on the lower tours.
    finding:
      question: Does the P-015 qualifier-favorite edge extend to Challenger/ITF?
      answer: "No — it does not replicate."
      evidence:
        - "tour quals (P-015 basis, the reference): n=238, +4.06c/ct, CI [+1.44, +6.34] — excludes zero"
        - "challenger quals: n=282, -1.98c/ct, CI [-5.24, +1.15] — crosses zero, point estimate NEGATIVE"
        - "ITF (all, no qual split available): n=312, -2.33c/ct, CI [-5.48, +0.59] — crosses zero, point estimate NEGATIVE"
        - "pooled ALL quals (tour+challenger+ITF): n=520, +0.78c/ct, CI [-1.44, +2.80] — includes zero"
      reading: >
        Pooling does not rescue it. The pooled +0.78c is the tour-level edge
        diluted by two negative cohorts, and its CI includes zero — that is an
        absence of evidence for P-015b, not evidence of a smaller edge. Note
        also that the pooled cohort would be ~161 trades/month against P-015's
        34, so the lower tours would dominate the blended number while
        contributing the negative point estimates.
    action_required: >
      OPEN ITEM FOR SAM — the drop/keep call on P-015b is yours, not the
      registry's. The evidence points to DROPPING P-015b: the mechanism did not
      replicate out of sample and the pooled CI includes zero. This entry does
      NOT kill it unilaterally, because P-015b is a registered research track.
      Per tennis_research/P015_DECISION_RULE.md:83-87, adding lower-tour series
      is a NEW strategy version with its own n counter and separate
      registration — it can never be folded into P-015's counter, so nothing
      here affects the running P-015 validation either way.
      Decide: (a) drop P-015b and close this track, or (b) state what further
      evidence would change the answer and what would be gathered to get it.
    note: >
      Registry corrected 2026-07-21: this entry previously said the analysis was
      "in flight". It had already finished the night before.

  - id: R-EV-MAP
    name: Kalshi EV Opportunity Map
    stage: build
    owner_dir: kalshi-ev-map
    blocked_on: nothing
    summary: >
      Document contradiction RESOLVED 2026-07-21. 05_build_roadmap.md previously
      opened with "Build 1 — MLB props engine (totals first) — start now" while
      03_validation.md recorded that Build 1's kill-test had FAILED (the
      +60%/trade MLB totals fade was a close-anchoring selection artifact). The
