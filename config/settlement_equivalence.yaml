policies:
  - id: gemini_kalshi_mlb_moneyline
    venues: [gemini, kalshi]
    market_family: mlb_moneyline
    document_ids: [gemini_baseball1, kalshi_mlbgame]
    decision: not_equivalent
    reviewed_at: 2026-08-10
    rationale: >-
      The ordinary winner and extra-innings payoff align, but postponement,
      cancellation, shortened-game, discretionary review, and tie outcomes do
      not. A complementary position therefore retains basis risk and is not an
      arbitrage.
    dimensions:
      underlying_event: equivalent
      binary_payout: equivalent
      extra_innings: equivalent
      settlement_sources: compatible
      postponement: different
      cancellation: different
      shortened_game: different
      discretionary_review: different
      tie_handling: different
    dimension_notes:
      tie_handling: >-
        Added 2026-08-10 from the strat_crossvenue_mlb_v1 integrity review
        (research/integrity/strat_crossvenue_mlb_v1_integrity_2026-08-10.json,
        extra.non_blocking_dimension_gap); both clauses read verbatim from the
        pinned documents, hashes re-verified byte-identical to expected_sha256.
        Gemini BASEBALL1 Rule 13.166(e)(1)(iv): "If {baseball game} results in
        a tie as officially recorded by the governing body (including any
        suspended game called as a tie), all Contracts shall resolve 'No'
        (i.e., {team did not win})." Kalshi BASEBALLGAMEWIN (MLBGAME.pdf): "If
        a 'Tie' strike is not listed for a given <time period> and <time
        period> of <baseball game> ends in a tie after all regulation and
        extra innings (unless specifically excluded), the market will resolve
        to $1/(the number of tied teams), rounded down. For example, if two
        teams tie, then each team strike will resolve to $0.50." Opposite
        payoffs on the same recorded-tie event: both team contracts pay No at
        Gemini versus a $0.50/$0.50 split at Kalshi. Low materiality (MLB
        essentially never records official ties) and no effect on the current
        not_equivalent decision — 'verified' requires every dimension
        equivalent regardless — recorded so the comparison table is complete
        before any future approval review.
    approval: null
  - id: prophetx_kalshi_mlb_moneyline
    venues: [prophetx, kalshi]
    market_family: mlb_moneyline
    document_ids:
      - prophetx_mlb_mainline_20260722
      - prophetx_rulebook_v1
      - kalshi_mlbgame
    decision: not_equivalent
    reviewed_at: 2026-08-10
    rationale: >-
      ProphetX voids games not starting on the scheduled local calendar day and
      uses a 36-hour suspended-game rule, while Kalshi can remain open or settle
      at fair value under different windows. Tie outcomes also diverge (void
      versus $1/n split). Measure as basis, never as a lock.
    dimensions:
      underlying_event: equivalent
      binary_payout: equivalent
      extra_innings: equivalent
      settlement_sources: compatible
      postponement: different
      cancellation: different
      suspended_game: different
      error_trade_review: different
      tie_handling: different
    dimension_notes:
      tie_handling: >-
        Added 2026-08-10, follow-up to the gemini_kalshi_mlb_moneyline tie
        amendment; both ProphetX documents re-fetched with hashes verified
        byte-identical to expected_sha256, clauses read verbatim. ProphetX
        40.6(a) filing Appendix A-3 (MLB Baseball Mainline Contracts, Moneyline
        sub-class), General Settlement Criteria Rule H: "if the event is called
        early while tied or during an inning in which the visiting team has
        taken the lead, it shall be treated as a suspended event and handled in
        accordance with Rule D above," and Rule D voids suspended events "not
        resumed within thirty-six (36) hours of the official scheduled start
        time" with collateral returned. No ProphetX provision addresses a
        completed game officially recorded as a tie, and the exchange rulebook
        (prophetx_rulebook_v1) contains no tie or dead-heat rule for these
        contracts. Kalshi BASEBALLGAMEWIN (MLBGAME.pdf) resolves an unlisted
        tie to "$1/(the number of tied teams), rounded down" ($0.50/$0.50 for
        two teams), and a game not resumed within 48 hours to the last fair
        market price. On the closest comparable path — called while tied,
        never resumed — ProphetX voids at collateral returned while Kalshi
        settles at last fair price or the $1/n split, so the payoffs diverge.
        No effect on the current not_equivalent decision; recorded for
        completeness of the comparison table.
    approval: null
