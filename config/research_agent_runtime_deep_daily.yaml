schema_version: 1
extends: research_agent_runtime_screened_daily.yaml
worker_id: research-codex-deep-daily-v1
stage_mode: deep_only
budget_scope: deep_research
status_filename: deep_status.json

limits:
  # One-week backlog-clearance trial, 2026-08-16 through 2026-08-23. Five of
  # the first seven separated screens survived, so two deep calls could not
  # keep pace. Re-evaluate the arrival/survival/advance rates after the trial.
  max_cost_usd_per_day: 0.04
  max_attempts_per_day: 4

screening:
  enabled: false

safety:
  trading_execution_allowed: false
  queue_mutation_in_dry_run: false
  service_mutation_allowed: false
  secrets_allowed_in_output: false
