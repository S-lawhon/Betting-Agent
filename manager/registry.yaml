  - id: R-TENNIS
    name: Tennis Research / P-015b lower tour
    stage: research
    owner_dir: tennis_research
    blocked_on: human
    summary: >
      ANALYSIS COMPLETE. analyze_lower_tour.py finished 2026-07-20 21:07;
      results in tennis_research/lower_tour_results.txt. The P-015 tour-level
      qualifier edge does NOT replicate out of sample on the lower tours.
    finding:
      question: Does the P-015 qualifier-favorite edge extend to Challenger/ITF?
      answer: "No — it does not replicate."
      evidence:
        - "tour quals (P-015 basis, the reference): n=238, +4.06c/ct, CI [+1.44, +6.34] — excludes zero"
        - "challenger quals: n=282, -1.98c/ct, CI [-5.24, +1.15] — crosses zero, point estimate NEGATIVE"
        - "ITF (all, no qual split available): n=312, -2.33c/ct, CI [-5.48, +0.59] — crosses zero, point estimate NEGATIVE"
        - "pooled ALL quals (tour+challenger+ITF): n=520, +0.78c/ct, CI [-1.44, +2.80] — includes zero"
      reading: >
        Pooling does not rescue it. The pooled +0.78c is the tour-level edge
        diluted by two negative cohorts, and its CI includes zero — that is an
        absence of evidence for P-015b, not evidence of a smaller edge. Note
        also that the pooled cohort would be ~161 trades/month against P-015's
        34, so the lower tours would dominate the blended number while
        contributing the negative point estimates.
    decision:
      verdict: DROPPED
      decided: 2026-07-21
      decided_by: Sam
      rationale: >
        P-015b is dropped and this track is closed. Three reasons, in order of
        weight:

        1. CONTAMINATION, not EV, is decisive. P-015 is at 0/120 and locked.
        The lower tours would supply ~127 of ~161 trades/month (79% of volume)
        from the two cohorts with NEGATIVE point estimates. Trading P-015b
        would swamp the tour-level signal and leave us measuring the pooled
        thing instead of the validated thing — destroying the ability to test
        the original hypothesis at all.

        2. The mechanism did not replicate. Both lower tiers have negative
        point estimates; the pooled CI includes zero. That is absence of
        evidence for P-015b, not evidence of a smaller edge.

        3. Opportunity cost is near zero. P-015 is time-blocked on US Open
        quals (Aug 17-21) regardless, so dropping P-015b forfeits nothing that
        was otherwise available.

        The tour-level P-015 edge (+4.06c/ct, CI [+1.44, +6.34]) is UNAFFECTED
        and its validation continues unchanged. Per
        tennis_research/P015_DECISION_RULE.md:83-87 the two were always
        separately registered with separate n counters, so this decision
        touches nothing in the running P-015 gate.
      what_would_reopen: >
        A materially larger lower-tour sample whose point estimates turn
        positive — not merely CIs that widen to include positive values. The
        current reading is not "underpowered and promising", it is "negative
        on both cohorts". Reopening on anything less would be selecting on
        noise. No collection is scheduled and none should be started.
    note: >
      Registry corrected 2026-07-21: this entry previously said the analysis was
      "in flight". It had already finished the night before.

