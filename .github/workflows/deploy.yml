name: Deploy To Droplet

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      restart:
        description: "Restart betting-pod-shop after sync"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_HOST: ${{ secrets['DEPLOY_HOST'] }}
      PYTHON: python3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest pyyaml requests numpy scipy cryptography

      - name: Validate deploy secrets
        run: |
          if [ -z "${DEPLOY_HOST}" ]; then
            echo "Missing secret: DEPLOY_HOST"
            exit 1
          fi
          if [ -z "${{ secrets['DEPLOY_SSH_KEY'] }}" ]; then
            echo "Missing secret: DEPLOY_SSH_KEY"
            exit 1
          fi

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cat > ~/.ssh/id_ed25519 <<'KEY'
          ${{ secrets['DEPLOY_SSH_KEY'] }}
          KEY
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts

      - name: Deploy (sync + optional restart)
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.restart }}" = "false" ]; then
            bash scripts/deploy.sh "${DEPLOY_HOST}"
          else
            bash scripts/deploy.sh "${DEPLOY_HOST}" restart
          fi
