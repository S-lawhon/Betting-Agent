        FIXED and DEPLOYED 2026-07-27 16:00 UTC (unit restarted onto the new
        code; verified in place that from_config yields a real
        AggregateRiskGuard with reserve_trade/release_reservation, and that
        band/offset/window/caps are byte-identical). The §7 precondition "wired into
