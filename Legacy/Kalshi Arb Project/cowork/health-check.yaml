---
# cowork/health-check.yaml
# ──────────────────────────────────────────────────────────────────────────────
# Automation: Verify the betting agent's environment is healthy and ready.
#
# What it does
# ────────────
#   1. Checks that all required Python packages are importable.
#   2. Validates config.yaml structure (required keys present, types correct).
#   3. Verifies .env secrets are present (but does NOT print their values).
#   4. Confirms data directories exist and are writable.
#   5. Checks that trade_log.jsonl was updated within the expected window —
#      alerts if the agent appears to have stopped scanning.
#   6. Inspects the risk manager cooldown state from the latest log entry.
#   7. Reports disk usage for the data/ directory.
#
# Scheduling
# ──────────
#   Every 30 minutes during market hours.  Alerts are emitted only on failure
#   so the user isn't spammed when everything is fine.
# ──────────────────────────────────────────────────────────────────────────────

name: health-check
display_name: "System Health Check"
description: >
  Verify that the betting agent environment is fully operational: Python
  packages importable, config.yaml valid, .env secrets present, data
  directories writable, trade log recently updated, and no cooldown active.
  Alerts on any failure.
version: "1.0"
category: monitoring

trigger:
  type: scheduled
  cron: "*/30 8-23 * * *"   # every 30 min, 8 am – 11:30 pm local time
  timezone: local

environment:
  working_directory: "."
  python_executable: python3

steps:
  - id: check_python_deps
    name: "Verify Python dependencies"
    description: >
      Import every runtime dependency listed in requirements.txt.
      Print [OK] or [FAIL] for each package.
    command: python3
    args:
      - "-c"
      - |
        import importlib, sys
        packages = {
            'yaml':       'pyyaml',
            'dotenv':     'python-dotenv',
            'structlog':  'structlog',
            'numpy':      'numpy',
        }
        all_ok = True
        for mod, pkg in packages.items():
            try:
                importlib.import_module(mod)
                print(f"  [OK]   {pkg}")
            except ImportError:
                print(f"  [FAIL] {pkg}  — run: pip install {pkg}")
                all_ok = False
        if not all_ok:
            sys.exit(1)
    on_failure: abort

  - id: validate_config
    name: "Validate config.yaml"
    description: >
      Load config.yaml with yaml.safe_load and confirm all required top-level
      keys are present and have the expected types.  Print each check result.
    command: python3
    args:
      - "-c"
      - |
        import sys, yaml
        from pathlib import Path
        try:
            cfg = yaml.safe_load(Path('config.yaml').read_text(encoding='utf-8'))
        except Exception as e:
            print(f"[FAIL] config.yaml unreadable: {e}")
            sys.exit(1)

        checks = [
            ('environment',          str),
            ('log_level',            str),
            ('kalshi',               dict),
            ('odds_api',             dict),
            ('risk',                 dict),
            ('edge',                 dict),
            ('matcher',              dict),
            ('learner',              dict),
            ('paths',                dict),
        ]
        ok = True
        for key, expected_type in checks:
            val = cfg.get(key)
            if val is None:
                print(f"  [FAIL] config.yaml missing key: {key!r}")
                ok = False
            elif not isinstance(val, expected_type):
                print(f"  [FAIL] config.yaml {key!r}: expected {expected_type.__name__},"
                      f" got {type(val).__name__}")
                ok = False
            else:
                print(f"  [OK]   {key}")

        # Warn if environment is 'live' without the safety flag
        if cfg.get('environment') == 'live':
            print("  [WARN] environment=live — confirm I_UNDERSTAND_LIVE_TRADING=true in .env")

        if not ok:
            sys.exit(1)
    on_failure: abort

  - id: check_secrets
    name: "Verify .env secrets (existence only)"
    description: >
      Confirm the three required secrets are set in the environment.  Their
      values are NEVER printed.
    command: python3
    args:
      - "-c"
      - |
        import os, sys
        from pathlib import Path
        from dotenv import load_dotenv
        load_dotenv(Path('.env'), override=False)
        required = ('KALSHI_EMAIL', 'KALSHI_PASSWORD', 'ODDS_API_KEY')
        ok = True
        for key in required:
            if os.environ.get(key):
                print(f"  [OK]   {key} is set")
            else:
                print(f"  [WARN] {key} is missing from .env")
                ok = False
        if not ok:
            print("  → Copy .env.example to .env and fill in your credentials.")
    on_failure: continue   # warn but don't abort — user may be in offline dev mode

  - id: check_directories
    name: "Verify data directories exist and are writable"
    description: >
      Create missing directories if needed; confirm write access by creating
      and immediately removing a small probe file.
    command: python3
    args:
      - "-c"
      - |
        import sys
        from pathlib import Path
        dirs = [
            Path('data/trade_logs'),
            Path('data/exports'),
            Path('data/schema'),
        ]
        ok = True
        for d in dirs:
            d.mkdir(parents=True, exist_ok=True)
            probe = d / '.write_probe'
            try:
                probe.write_text('x', encoding='utf-8')
                probe.unlink()
                print(f"  [OK]   {d}  (writable)")
            except OSError as e:
                print(f"  [FAIL] {d}  ({e})")
                ok = False
        if not ok:
            sys.exit(1)
    on_failure: abort

  - id: check_log_freshness
    name: "Check trade log freshness"
    description: >
      If trade_log.jsonl exists, confirm its most recent timestamp is within
      the last 10 minutes (to detect a stalled scan loop).  Skip if the
      agent has never run.
    command: python3
    args:
      - "-c"
      - |
        import json, sys
        from datetime import datetime, timezone, timedelta
        from pathlib import Path
        log_path = Path('data/trade_logs/trade_log.jsonl')
        if not log_path.exists():
            print("  [INFO] trade_log.jsonl not found — agent has not run yet.")
            sys.exit(0)
        lines = [l for l in log_path.read_text(encoding='utf-8').splitlines() if l.strip()]
        if not lines:
            print("  [INFO] trade_log.jsonl is empty — agent has not logged anything yet.")
            sys.exit(0)
        last_ts = None
        for raw in reversed(lines):
            try:
                rec = json.loads(raw)
                ts_str = rec.get('timestamp') or rec.get('as_of') or ''
                if ts_str:
                    last_ts = datetime.fromisoformat(ts_str.replace('Z', '+00:00'))
                    break
            except Exception:
                continue
        if last_ts is None:
            print("  [WARN] Could not parse any timestamp from trade_log.jsonl.")
            sys.exit(0)
        age = datetime.now(tz=timezone.utc) - last_ts
        threshold = timedelta(minutes=10)
        if age > threshold:
            print(f"  [WARN] Last log entry is {int(age.total_seconds() / 60)} min old"
                  f" (threshold={threshold}).  Agent may have stopped.")
        else:
            print(f"  [OK]   Last log entry: {int(age.total_seconds())}s ago")
    on_failure: continue

  - id: check_cooldown
    name: "Check risk manager cooldown status"
    description: >
      Inspect the most recent startup log entry for cooldown state.  Alert if
      the agent is paused due to the daily loss breaker.
    command: python3
    args:
      - "-c"
      - |
        import json
        from pathlib import Path
        log_path = Path('data/trade_logs/trade_log.jsonl')
        if not log_path.exists():
            print("  [INFO] No log file — skipping cooldown check.")
            exit(0)
        for raw in reversed(log_path.read_text(encoding='utf-8').splitlines()):
            if not raw.strip():
                continue
            try:
                rec = json.loads(raw)
                if rec.get('in_cooldown'):
                    until = rec.get('cooldown_until', 'unknown')
                    print(f"  [WARN] Agent is in COOLDOWN until {until}")
                    print("         Daily loss limit was hit.  Trading paused.")
                    exit(0)
            except Exception:
                continue
        print("  [OK]   No active cooldown")
    on_failure: continue

  - id: disk_usage
    name: "Report data/ directory disk usage"
    description: >
      Print the total size of the data/ directory tree so the user can
      spot unexpectedly large log files before they fill the disk.
    command: python3
    args:
      - "-c"
      - |
        from pathlib import Path
        total = sum(f.stat().st_size for f in Path('data').rglob('*') if f.is_file())
        mb = total / (1024 * 1024)
        print(f"  [INFO] data/ directory: {mb:.2f} MB ({total:,} bytes)")
        if mb > 500:
            print("  [WARN] data/ is over 500 MB — consider archiving old exports.")
    on_failure: continue

notifications:
  on_success: false    # silent when healthy
  on_failure: true
  failure_message: >
    Betting agent health check failed.  Review the step output above for
    details.  Common causes: missing .env secrets, broken Python install,
    full disk, or stalled scan loop.
