# =============================================================================
# FUND MANAGER REGISTRY — single source of truth for every workstream
# =============================================================================
#
# This file is the thing that did not exist before: the project's state was
# scattered across 9 memory files, 6 research directories, PROJECT_STATUS.md
# (stale since March), config_multi_pod.yaml, and two crontabs on two hosts.
#
# EDIT THIS FILE when a workstream changes stage, a gate is reached, or you
# unblock something. The collector reads it; it never writes it. Everything
# the manager reports is derived from here plus measured facts.
#
# ---------------------------------------------------------------------------
# blocked_on semantics — this is what drives "what do I need to jump back into"
# ---------------------------------------------------------------------------
#   human    -> WAITING ON YOU. Surfaces in the brief every day until cleared.
#   time     -> Accumulating sample. Silent until `gate` thresholds are met.
#               (P-015 needs ~6 months of trades; nagging daily is noise.)
#   data     -> Waiting on a data pull/backfill that is already running.
#   external -> Waiting on a third party (API access, fee schedule, venue).
#   measurement -> The blocker is not calendar and not a defect: it is that the
#               ACCRUAL RATE is not yet measured, so no resolution date can be
#               stated. Carries `recheck_after`. Distinct from `time`, which
#               asserts a sample is accruing at a known rate -- claiming that
#               when the rate is unknown is how a gate that cannot resolve gets
#               reported as one that is patiently waiting.
#   backtest -> Code exists and is INERT; waiting on its own validation study,
#               not on calendar. Distinct from `time` on purpose: `time` means
#               a sample is accruing toward a defined gate, and labelling a
#               pre-backtest pod `time` implies a decision rule that does not
#               exist. Matches no branch in checks.py or brief.py, so it stays
#               out of both the action list and the accumulating list.
#   nothing  -> Running normally; report by exception only.
#
# A workstream with blocked_on: time NEVER appears in the action list until its
# gate fires. That is deliberate — report by exception, or you stop reading.
#
# stage: live | paper | build | research | parked | killed
# =============================================================================

meta:
  version: 1
  updated: 2026-07-20
  # Paths are resolved relative to project_root unless absolute.
  project_root: /opt/betting-pod-shop
  local_root: /Users/samlawhon/Desktop/Betting Fund Project

# -----------------------------------------------------------------------------
# Global invariants — violations are always alertable regardless of workstream
# -----------------------------------------------------------------------------
invariants:
  all_trading_is_paper:
    description: >
      Every pod must be in paper/demo mode. Real money has never been deployed.
      If any pod reports mode != paper, that is a P1 alert — it means either a
      config mistake or an unreviewed promotion.
    severity: critical
  kill_switch_absent:
    description: Presence of data/KILL_MAKER means P-016 was killed; surface it.
    severity: warn

# -----------------------------------------------------------------------------
# SERVICES — process-level liveness
# -----------------------------------------------------------------------------
services:
  # P-022's standalone maker loop. Registered 2026-07-26 because it had been
  # "active" and doing nothing since 2026-07-23 and NOTHING NOTICED — it could
  # not quote at all (far-future close field; see the P-022 workstream), and
  # with no monitoring entry the manager had no opinion about it either way.
  #
  # Deliberately NO heartbeat file. Its quotes log only appears once it quotes,
  # and long silences are legitimate: golf round-leader markets are unlisted
  # between tournaments, and quotes are only placed in a 12-24h pre-round
  # window. A stale-file check here would page nightly for correct behaviour.
  # The gate reader (scripts/p022_checkpoint.py) is what catches "running but
  # never producing"; this entry only catches the unit being down.
  - id: betting-round-leader-fade
    kind: systemd
    description: P-022 round-leader dead-heat fade maker (standalone, paper)
    severity: warn

  - id: betting-pod-shop
    kind: systemd
    description: Main 5-minute multi-pod engine (P-001/002/006/014/015) + dashboard
    cycle_seconds: 300
    heartbeat:
      file: data/trade_logs/trade_log.jsonl
      # Engine writes constantly (~99% SKIPPED_EDGE rows). 20 min of silence
      # means the loop is wedged even if systemd still calls it "active".
      max_stale_minutes: 20
      # ...EXCEPT when the aggregate-risk guard trips the daily-loss limit: it
      # skips the whole scan cycle, so NO telemetry rows are written and the
      # file above goes stale even though the loop is spinning (observed
      # 2026-07-25: a P-017 golf tournament settled -19.7% and halted trading
      # for the rest of the UTC day). The journal is the real liveness signal
      # in that state — the loop logs a "guard halted" line every cycle. If a
      # halt line appears within halt_signal.max_silent_journal_minutes, the
      # silence is DELIBERATE, not a wedge: demote CRITICAL -> info. A loop that
      # truly wedges while halted stops logging too, so the halt line ages out
      # and the CRITICAL still fires — the safety property is preserved.
      halt_signal:
        pattern: "guard halted (daily_loss_limit"
        max_silent_journal_minutes: 12   # > 2 scan cycles (300s each)
    severity: critical

  # The standalone dashboard, split out of the engine 2026-07-30. Registered so
  # its own death is visible in the daily brief — the lesson from the evmap
  # timers, where a job that stopped producing looked healthy because nothing
  # watched it.
  #
  # NO heartbeat file on purpose: this process writes nothing (the systemd unit
  # enforces that with ReadOnlyPaths and no ReadWritePaths), so `active` from
  # systemd IS the liveness signal. Inventing a heartbeat file would mean giving
  # a read-only process write access purely to satisfy monitoring.
  #
  # severity: warn, not critical — the dashboard being down costs visibility,
  # not money, and paging critical for it would train the alert to be ignored.
  - id: betting-dashboard
    kind: systemd
    description: Standalone file-backed dashboard on 127.0.0.1:8081 behind Caddy
    severity: warn

  # Recursive strategy agent loop: queue-based worker that persists the
  # registry and emits a heartbeat on every pass. This is the operational
  # surface for the new strategy factory runtime, not a trading process.
  - id: betting-strategy-agents
    kind: systemd
    description: Recursive strategy agents (queue-driven registry worker)
    heartbeat:
      file: data/strategy_agents/heartbeat.jsonl
      max_stale_minutes: 30
      inspect_last_row: true
    severity: warn

  # RETIRED 2026-07-22. P-016 (v1 and v2) both failed their pre-registered
  # gates (v1 adverse selection; v2 founding premise refuted). Kill switch
  # data/KILL_MAKER was hit 2026-07-22 01:22:40 UTC; the maker pulled all
  # quotes within one cycle (last fill 01:23:00) and drained its open books.
  # The heartbeat check cannot distinguish a wedged loop from a deliberately
  # killed one, so leaving this entry in place paged CRITICAL every cycle
  # ("silent for N min") for an intentionally-silent unit. The betting-live-
  # maker systemd unit is being stopped + disabled; monitoring is removed so a
  # retired unit fires neither the stale check nor service.down once inactive.
  # - id: betting-live-maker
  #   kind: systemd
  #   description: P-016 Live Maker, 12s fast loop, separate unit (can't live in 5-min engine)
  #   cycle_seconds: 12
  #   heartbeat:
  #     file: data/trade_logs/maker_quotes.jsonl
  #     max_stale_minutes: 45
  #     only_during: mlb_games_window
  #   severity: critical

# -----------------------------------------------------------------------------
# SCHEDULED JOBS — the silent-failure surface. clv_settlement proved this:
# the cron RAN, exited clean, and wrote zero rows for 31 hours. Exit code is
# not evidence of success; only fresh output is.
# -----------------------------------------------------------------------------
jobs:
  - id: clv_settlement
    host: droplet
    schedule: "30 7 * * *"
    description: Captures Pinnacle closing lines for the P-001 CLV forward test
    output:
      file: data/trade_logs/clv_log.jsonl
      max_stale_hours: 48   # daily job, 2-day grace for genuinely empty days
    severity: warn
    note: >
      FIXED 2026-07-21. Root cause: P-001 settles 01:00-02:00 UTC, the trade log
      rotates at 06:00, and this job ran at 07:30 reading ONLY the active log —
      whose window began after the rotation. On every day rotation fired, the
      job was structurally guaranteed to find zero settlements. Rotation is
      size-triggered and therefore irregular (Jul 8, 11, 17, 20), so it appeared
      to work intermittently rather than failing outright.
      Fix: scripts/clv_settlement.py now scans the active log PLUS the last
      CLV_ARCHIVE_LOOKBACK (default 3) archives. Safe by construction — the job
      already deduped by fingerprint, so re-reading captured rows is a no-op.
      Recovered 4 records immediately (25 -> 29 rows).
      RESOLVED 2026-07-26 (CLV capture diagnostic, run-queue task 4). The
      "10 of 14" was NOT a close_fair() defect: corpus-wide capture is 650/671
      settled MLB bets = 96.9%, and the replay over all nine archives produced
      ZERO API_ERROR (quota was never near — 4.87M of ~5M credits remain). A
      same-day miss simply self-heals, because the job re-reads 10 archives and
      dedupes by fingerprint. Residual after five months: 21 bets (9 TIME_GT_3H,
      7 NO_TEAM_MATCH, 1 NO_PINNACLE, 4 recovered by taking team names from the
      ticker instead of the free-text `event` field).
      THE REAL PROBLEM IS UPSTREAM: the P-001 matcher broke fuzzy-score ties by
      list order, so 528 of 671 settled MLB bets (79%) were placed on a Kalshi
      market for a DIFFERENT DAY'S GAME than the Odds API event that produced
      the edge. Those rows carry +0.19c/ct CLV (CI [-0.28,+0.69]) vs +7.65c/ct
      for the correctly-matched 105. The 650-row log therefore MEETS the 200-row
      gate on a number (+1.39c/ct) that does not test the hypothesis.
      Fix written but NOT DEPLOYED (Legacy/Kalshi Arb Project/src/matcher.py:
      time-proximity tie-break + ticker-derived start window; regression tests in
      tests/test_clv_capture.py). Gate re-scope proposed, awaiting Sam.

  - id: rotate_active_log
    host: droplet
    schedule: "0 6 * * *"
    description: Size-rotates trade_log.jsonl into gzipped archives
    output:
      glob: data/trade_logs/trade_log.archive_*.jsonl.gz
      max_stale_hours: 48
    severity: info

  # Maintains data/dashboard/rollup.json — the dashboard's lifetime aggregates.
  #
  # max_stale_hours: 3 gives the hourly timer two misses before it alarms.
  #
  # ⚠ This output is the SYSTEM OF RECORD for pre-horizon history: once
  # rotate_active_log prunes an archive (KEEP_ARCHIVES = 12), the rows it held
  # survive only in these counters and cannot be rebuilt from disk. The job
  # writes rollup.json.bak.gz alongside it for that reason. A stale rollup is a
  # cosmetic problem; a LOST rollup is unrecoverable history.
  - id: dashboard_rollup
    host: droplet
    schedule: "7 * * * *"
    description: Incremental dashboard rollup (lifetime P&L, skip reasons, placement rate)
    output:
      file: data/dashboard/rollup.json
      max_stale_hours: 3
    severity: warn
    note: >
      systemd timer dashboard-rollup.timer, not crontab. First run must be
      manual with --full and off a deploy window. Back this output up.

  - id: shadow_maker
    host: droplet
    schedule: "*/30 * * * *"
    description: Shadow maker quote collection (guardrail-cost measurement)
    output:
      file: data/shadow_maker/quotes.jsonl
      max_stale_hours: 3
    severity: info

  - id: maker_diagnostics
    host: droplet
    schedule: "47 13 * * *"
    description: P-016 Tier-1 recursive review — daily backstop for fill-triggered runs
    output:
      file: /var/log/maker_diagnostics.log
      max_stale_hours: 48
    severity: info
    note: Added 2026-07-20; had not fired yet as of first inventory.

  # Registered 2026-07-27. NOT a heartbeat — see the services comment on
  # betting-round-leader-fade: P-022's silence is legitimate between
  # tournaments, so a stale-file check on its quote log would page nightly for
  # correct behaviour. This job instead answers the question a heartbeat
  # cannot: is silence CORRECT right now? It alarms on two conditions only —
  # a quotable window open with zero quotes, and (the live 2026-07-27 state) a
  # close reference that is a fallback placeholder, which means no window can
  # open while the markets are tradeable.
  #
  # Deliberately does NOT reuse the pod's window arithmetic. A detector that
  # decides "is a window open?" the way the pod does agrees with the pod when
  # the pod is wrong, and would have sat silent through all three dead days.
  - id: p022_window_check
    host: droplet
    schedule: "*/30 * * * *"
    description: P-022 quotable-window detector — makes the pod's silence observable
    output:
      file: data/p022_window_check/status.jsonl
      max_stale_hours: 3
    severity: warn
    note: >
      DEPLOYED 2026-07-27 16:00 UTC and verified on the droplet, but NOT YET
      CRONTABBED — it only runs when invoked by hand, so this job will read
      stale until the schedule above is actually installed. Adding it is a
      one-line crontab change and is Sam's call.
      Currently ALARMING (state CLOSE_REF_PLACEHOLDER) on every run: 346 markets
      across 3 events are listed, and all five Kalshi time fields collapse to
      one ~20-day fallback, so the pod's [12h, 24h] window opens roughly a
      fortnight after the round has settled. Exit 1 = alarm, 0 = fine.

  # --- kalshi-ev-map weather pipeline — MOVED TO THE DROPLET 2026-07-29 -----
  #
  # These ran under the Mac's crontab and FAILED 139 OF 139 RUNS with
  # "Operation not permitted": macOS TCC denies `cron` read access under
  # ~/Desktop, so python could not open the script. They failed AWAKE, not
  # only asleep, and the previous note here ("sleep-gap prone") named the
  # wrong cause. Six days of point-in-time weather paper quotes (~1,200/day)
  # are permanently gone — the public horizon is 90 days.
  #
  # The weekly archiver failed a DIFFERENT way: data/cron_archive.log never
  # existed, so that line never executed at all — Sunday 03:17 local, and cron
  # does not run jobs missed while the Mac is asleep. Two failure modes, one
  # fix.
  #
  # Now systemd timers, scheduled in America/Chicago so the local-day
  # semantics of the weather markets are unchanged. Every run goes through
  # scripts/evmap_job.py, which records the rows actually WRITTEN, not just an
  # exit code — `manager/checks.py::check_evmap` treats exit 0 with zero rows
  # as a failure, because that is the half of the 139 that an exit code could
  # never have seen.
  # ---------------------------------------------------------------------------
  # P-029 Phase 0 — the JOBS run on their OWN VPS (143.198.162.120), not the
  # droplet and not the Mac, and neither collector can stat that box. Until
  # 2026-07-30 these entries were declared `host: p029` and reported
  # `uncheckable` (INFO) forever — an admitted gap, but chatter that measured
  # nothing.
  #
  # Now they measure a HEARTBEAT instead of the job's own output.
  # `p029-health-check.timer` ON THE DROPLET (daily 13:15 UTC, Persistent=true)
  # runs scripts/p029_health_check.py --no-push, which SSHes to the box,
  # verifies each job where it actually runs (shadow unit active + sqlite
  # fresh <2h on-box; newest archive file <30h and unit not failed), and
  # appends a row to data/p029_heartbeat/<id>.jsonl ONLY when the check
  # passes. `host: droplet` below describes where the measured EVIDENCE
  # lives, not where the job runs. Deploys don't clobber it (deploy.sh
  # excludes data/).
  #
  # Until 2026-08-01 the runner was a scheduled task on the MAC (plus an
  # rsync push leg), and on 2026-08-01 both heartbeats went 35h stale purely
  # because the Mac was asleep at the scheduled hour — the same failure mode
  # that moved the evmap jobs onto droplet timers (comment above). One-time
  # droplet setup: scripts/setup_p029_health_timer.sh. Manual Mac runs still
  # work and still push.
  #
  # A stale heartbeat therefore means: the on-box check FAILED, or the
  # droplet timer/probe broke — all of which deserve the warn this fires.
  # Do not "fix" a stale heartbeat by touching the file; run the script.
  #
  # Deliberately NOT in `services:` above — check_services shells out to a
  # LOCAL systemctl, so a p029-shadow entry there would resolve to "not-found"
  # on the droplet and page CRITICAL every 15 minutes for a healthy unit.
  - id: p029_shadow
    host: droplet
    schedule: continuous (p029-shadow.service on the P-029 VPS, Restart=always)
    description: >-
      P-029 Phase 0 public shadow logger — combo margin tape for Gate 0
      (measured via daily SSH heartbeat, p029-health-check.timer on the droplet)
    output:
      file: data/p029_heartbeat/p029_shadow.jsonl
      max_stale_hours: 30
    severity: warn
    note: >
      Heartbeat cadence is DAILY, so the on-box 2h-freshness rule lives in
      scripts/p029_health_check.py, not in max_stale_hours here. Single-instance
      guarded via a SQLite lock: a second copy refuses to start, and a stalled
      logger still reports systemd-active. Freshness of the DB is the only real
      liveness signal. A gap in the tape CANNOT be backfilled.

  - id: p029_archive
    host: droplet
    schedule: "*-*-* 09:30 UTC (p029-archive.timer on the P-029 VPS, RandomizedDelaySec=600)"
    description: >-
      P-029 settled-combo archiver — Kalshi purges these after ~3 months
      (measured via daily SSH heartbeat, p029-health-check.timer on the droplet)
    output:
      file: data/p029_heartbeat/p029_archive.jsonl
      max_stale_hours: 30
    severity: warn
    note: >
      A missed day is PERMANENT data loss, not a delayed job — Kalshi purges
      settled combo markets after ~3 months and the NFL/NBA season is the regime
      that matters (the whole research tape is summer MLB/WNBA/World Cup).
      Worth running even if P-029 is killed at Gate 0. Archived files must be
      pulled down and committed under combo_research/archive/ — see the
      check_research_committed.sh convention in CLAUDE.md.

  - id: evmap_weather_sheet
    host: droplet
    schedule: "*-*-* 06:53 America/Chicago (evmap-weather-sheet.timer)"
    description: Weather fair-value sheet (ensemble -> bracket probabilities)
    output:
      file: kalshi-ev-map/data/job_status.jsonl
      max_stale_hours: 30
    severity: warn

  - id: evmap_weather_depth
    host: droplet
    schedule: "*-*-* 09,12:23 America/Chicago (evmap-weather-depth.timer)"
    description: Weather book-depth snapshot
    output:
      file: kalshi-ev-map/data/weather_depth.parquet
      max_stale_hours: 30
    severity: warn

  - id: evmap_paper_maker
    host: droplet
    schedule: "*-*-* 07..19:13,43 America/Chicago (evmap-paper-maker.timer)"
    description: Weather paper maker quote intents — Build 2's 30-day evidence clock
    output:
      file: kalshi-ev-map/data/paper_quotes.parquet
      max_stale_hours: 20
    severity: warn
    note: >
      This is the job the 30-day clock counts. First droplet run 2026-07-28
      03:11 UTC, +114 quote intents verified by row count.

  - id: evmap_paper_eval
    host: droplet
    schedule: "*-*-* 07:37 America/Chicago (evmap-paper-eval.timer)"
    description: Previous day's paper-quote evaluation against the public tape
    output:
      file: kalshi-ev-map/data/job_status.jsonl
      max_stale_hours: 30
    severity: warn

  - id: evmap_archive_settled
    host: droplet
    schedule: "Sun *-*-* 03:17 America/Chicago (evmap-archive-settled.timer)"
    description: Weekly settled-market archiver — 90-day API horizon means gaps are permanent
    output:
      file: kalshi-ev-map/data/settled_archive.parquet
      max_stale_hours: 216   # weekly + a day of slack
    severity: warn
    enabled: false
    note: >
      TIMER DISABLED 2026-07-29 — this job is BLOCKED, and deliberately so.

      It has NEVER SUCCEEDED ANYWHERE: settled_archive.parquet and
      archive_state.json have never existed on the Mac, and cron_archive.log
      does not exist either, so the Mac line never even executed (Sunday 03:17
      local; cron does not run jobs missed while asleep — a different failure
      mode from the other four, which were TCC).

      On the droplet the first run was OOM-killed at 433s, 1.66GB RSS on a 2GB
      box, because the script accumulated every settled market of the window
      before filtering. Chunked accumulation (row-wise equivalent; no
      methodology change) got it further but it was still climbing past 1.4GB
      at 35 minutes with 95MB free, so it was stopped and disabled: the same
      box runs betting-pod-shop and betting-round-leader-fade, and letting the
      OOM killer choose between them the night before P-022's first placement
      window is not a trade worth making.

      Root cause is the window, not the loop: with no archive_state.json it
      pulls a 10-day slice of ALL settled Kalshi markets, most of which are
      MVE parlay husks. The fix is to bound the pull (write parquet
      incrementally per chunk, or seed archive_state.json so the window is a
      day rather than ten) — a real change to the collector, and Sam's call.
      Until then the 90-day horizon keeps rolling and the calibration history
      that falls off it is gone.

# =============================================================================
# WORKSTREAMS
# =============================================================================
workstreams:

  # ---------------------------------------------------------------------------
  # LIVE (paper) PODS
  # ---------------------------------------------------------------------------
  - id: P-001
    name: Kalshi Moneyline Value
    stage: paper
    tier: validating
    owner_dir: src/pods/kalshi_moneyline.py
    # WAS `time`, which was dishonest in both directions. At the all-time 14.3%
    # admissibility rate the gate needs ~31 weeks and cannot resolve inside the
    # MLB season, so it was inert rather than accruing; and the reason the rate
    # was 14.3% was a DEFECT, not calendar.
    #
    # Measured 2026-07-29: the defect is fixed. 3 of 3 post-fix placements are
    # admissible, worst delta 7 minutes, and the exactly-24.00h tie-break
    # fingerprint — 152 rows all-time — has ZERO post-fix instances, its last
    # occurrence being 2026-07-26 21:26:45Z, five minutes before the fixed
    # process started at 21:31:32Z.
    #
    # It is not `time` yet, because the RATE is measured at n=3. It becomes
    # `time` the moment n >= 10 post-fix placements confirms it; see
    # research/REPORT_P001_Admissibility_2026-07-29.md §6.
    blocked_on: measurement
    recheck_after: "2026-08-01"
    summary: >
      Core moneyline pod. Lifetime verdict was KEEP-but-RECALIBRATE (model
      overconfident ~5pp). CLV gate active since 2026-07-19 restricting to
      underdogs <50c with positive net-edge-maker.
    gate:
      question: Does realized underdog ROI follow the measured +1.4pp net-maker CLV?
      # RE-SCOPED 2026-07-26 (scenario D, approved by Sam). The metric is
      # UNCHANGED — de-vigged Pinnacle close, net of maker fee. What changed is
      # which trades are ELIGIBLE.
      #
      # The old gate counted rows in clv_log. It stood at 650 of a 200 threshold
      # reading +1.39c/ct — almost exactly the +1.4pp target it was written
      # against. Read literally, P-001 had passed. It should not have: the
      # matcher broke fuzzy-score ties by list order, and every game of an MLB
      # series shares team names, so 628 of 734 settled MLB bets (85.6%) were
      # priced off a DIFFERENT DAY'S game. Correctly-matched rows carry
      # +7.65c/ct (CI [+3.46,+12.05]); mismatched rows carry +0.19c/ct.
      metric: admissible_clv_forward_rows
      source: p001_checkpoint
      reader: scripts/p001_checkpoint.py
      threshold: 200
      epoch_utc: 2026-07-26T21:31:00Z   # matcher fix live on the droplet
      admissible_rule: "|ticker-encoded start - priced game_time| <= 3h, MLB only"
      # progress is DERIVED by the reader. Do not hand-maintain it here.
      decision: >
        The open tension: dogs are CLV-positive but were ROI-negative
        retrospectively. Forward test must confirm ROI follows CLV. Until then
        do not scale P-001.
        Scenario D: clean forward sample only. The 105 legacy admissible rows are
        NOT carried in — they are non-randomly selected (the cases where the odds
        list happened to hold one game for that pair; 83 of 105 are April), and
        mixing two matcher regimes muddies the replication. At 5-8 MLB
        settlements/day this lands late Aug - early Sept 2026.
        Silence is not confirmation: if the clean sample never reaches 200 the
        verdict stays NO DECISION and P-001 is not promoted by default.
    watch:
      - >
        clv_log freshness. NOT broken — corpus capture is 96.9% (650/671) with
        zero API errors; see jobs.clv_settlement.
      - >
        The matcher defect is INVISIBLE in clv_log alone: its `commence` field
        agrees with the ticker in 650 of 650 rows, because settlement re-derives
        it from the ticker's own time. Only a join to the trade log's `game_time`
        exposes it. Never audit this gate from clv_log by itself.

  - id: P-002
    name: Kalshi-Polymarket Cross-Venue Arb
    stage: shelved
    tier: none
    blocked_on: nothing
    shelved:
      decided: 2026-07-21
      decided_by: Sam
      reason: >
        NO POLYMARKET EXECUTION ACCESS. P-002 is a dual-leg arb executing on
        kalshi + polymarket + multi, and a dual-leg arb cannot be completed
        one-legged — one-legged is a different (and unvalidated) strategy.
        Polymarket US (api.polymarket.us, CFTC-regulated DCM) shares nothing
        technically with the offshore CLOB: different host, auth (Ed25519 API
        keys, not wallet/EIP-712), SDK and settlement, and the international
        API lists the US as CLOSE-ONLY on both frontend and API. So
        src/polymarket_client.py's place_order()/cancel_order() are unusable
        from here. Evidence: research/OPEN_QUESTIONS_2026-07-20.md Q2.
      also_note: >
        This supersedes the fill-realism question rather than answering it. The
        pod was already unpersuasive on its own terms — best raw P&L (+$1,268)
        but day-level insignificant (p=0.17), ~2/3 of profit from a single $816
        bet, 74% void rate, and arb-in-paper systematically overstates edge by
        assuming both legs fill. Do NOT treat its historical P&L as evidence of
        anything.
      void_rate_likely_explained: >
        Found 2026-07-21, after the shelve decision. P-002 runs on MLB via
        cross_venue_matcher._SPORT_TICKER_PREFIXES, and that matcher is
        title-only with skip_time_check=true. MLB plays 3-4 game series against
        the same opponent, so Polymarket lists three IDENTICALLY TITLED events
        on different dates — and 32 of 58 measured MLB matches paired a Kalshi
        market with a Polymarket event for a DIFFERENT GAME DAY. More than half
        the MLB "arbs" were comparing tomorrow's price against today's fair
        value: phantom edges that then void.
        That is a plausible mechanical cause of the 74% void rate, and it means
        the historical P&L is not merely underpowered but partly measuring a
        bug. Fix key exists: markets[0].gameStartTime matches Odds API
        commence_time to the minute, and the slug carries the date.
        Anyone reviving this pod must fix the date key BEFORE re-measuring —
        otherwise they will re-derive the same phantom edge.
      reversible: >
        Removed from pods.active only. Kalshi-side support is untouched.
        Re-enable if US Polymarket access opens — but the fill-realism
        validation would still be owed before believing any of its numbers.

  - id: P-006
    name: Sportsbook-Polymarket Consensus
    stage: shelved
    tier: none
    blocked_on: nothing
    shelved:
      decided: 2026-07-21
      decided_by: Sam
      reason: >
        NO POLYMARKET EXECUTION ACCESS, and P-006 executes on polymarket ONLY
        (verified: venue="polymarket" is its sole execution venue). Unlike
        P-002 it has no Kalshi leg at all, so it cannot trade AT ALL without
