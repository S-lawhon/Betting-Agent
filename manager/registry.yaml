        it validates in paper. Continuing to accumulate paper evidence for a
        strategy that has no executable path is the clearest case for shelving
        in the book. Same access evidence as P-002:
        research/OPEN_QUESTIONS_2026-07-20.md Q2.
      cost_of_shelving: >
        This was the most trustworthy edge in the lifetime analysis — per-bet
        CI [+5.4%, +21.2%] above zero, well calibrated, no outlier dependence.
        Shelving it is NOT a judgement on the edge, which may well be real. It
        is a judgement that an unexecutable edge is not worth API budget or
        attention. Record this so nobody later reads "shelved" as "refuted".
      known_defect_at_shelve_time: >
        SANITY_SKIP rate of 5-11 markets/cycle, which the pod's own message
        calls a "probable mapping error". LIKELY ROOT-CAUSED 2026-07-21 — see
        real_blockers below. Its historical numbers were produced with the
        defect present, so do not trust them even though the edge looked good.
      real_blockers: >
        Found 2026-07-21 on the first end-to-end exercise of the MLB path.
        These are the reasons MLB was never safe here, and they supersede the
        long-standing "pending Polymarket regular-season markets" note, which
        was STALE — series_id=3 now lists current games (109 live) and Kalshi
        KXMLBGAME is open (68 markets), with title matching scoring 100.0.

        (A) NON-MONEYLINE CONTAMINATION. tag_id=100639 does not exclude
        derivatives: of 127 events, 20 are "First 5 Innings Winner" and 19 are
        "Player Props". They clear the 55.0 fuzzy threshold against the
        full-game Odds API event and get priced AS the moneyline — 63 matches
        collapse onto just 15 distinct games. F5 sits 6-13c BELOW the game line
        (median ~9c), so each contaminated event shows a large one-directional
        phantom edge, far above min_edge_pct 0.008. Their outcomes are
        ['Yes','No'] / ['Over','Under'], so _infer_yes_team has no signal.

        (B) DATE COLLISION. MLB plays 3-4 game series against one opponent, so
        Polymarket lists three IDENTICALLY TITLED events on different dates.
        Matching is title-only with skip_time_check=true: 32 of 58
        cross_venue_matcher MLB matches pair a Kalshi market with a Polymarket
        event for a DIFFERENT DAY. Tomorrow's price against today's fair value
        is a phantom edge. Fix key exists and is reliable —
        markets[0].gameStartTime matches Odds API commence_time to the minute,
        and the slug carries the date.

        Either mechanism produces exactly the "probable mapping error" symptom
        above, so treat the SANITY_SKIP defect as explained rather than open.
      liquidity_belief_corrected: >
        LIQUIDITY IS NOT A BLOCKER, and the earlier belief that it was is
        wrong. Today-slate game-winner books show a 1c spread and $88k-176k of
        depth within +/-3c. The thin ~$700-900 / 40c books sampled previously
        were alt-lines and derivatives (Spread -1.5, 1st 5 Innings O/U, Extra
        Innings, median ~$900) plus far-future stale events. P-006 reads
        markets[0], which is consistently the true moneyline.
        NOTE: this also corrects the caveat recorded against build3-gate on
        2026-07-21, which cited ~40c Polymarket spreads as a reason a
        cross-venue basis study would mostly measure Polymarket's own spread.
        That sampling was of the wrong markets.
      reversible: >
        Removed from pods.active only; code and matcher support untouched.
        If revived, the order of work is: fix blockers A and B above FIRST
        (filter derivative events, and key matching on gameStartTime rather
        than title), then re-measure. Do NOT cite "pending Polymarket
        regular-season markets" as the blocker — that is stale.

