      betting-round-leader-fade). Deliberately NOT in pods.active — it runs its
      own fast loop. Sells YES on cheap Kalshi round-leader names; a tie for the
      round lead splits the payout $1/n, so a name that leads realises only
      ~$0.63. Validated Phase 1 (+4-6c/ct settled) and Phase 2 (+3.4c/ct at
      offset +0.02, tournament-clustered CI [+1.7,+5.1], 16/19 tournaments
      positive), and Phase 2 was independently reproduced from a from-scratch
      harness on 2026-07-26.
      HISTORY WORTH KNOWING: the service ran from 2026-07-23 21:15 UTC but wrote
      ZERO quotes and zero fills for three days — `_close_epoch` preferred
      `occurrence_datetime`, which on this family is a far-future placeholder
      13-18 days past `close_time`, so the 12-24h placement window opened long
      after each round had settled. Reconciled against the locked rule and
      restarted 2026-07-26 22:36 UTC. T counts from that restart; nothing was
      lost, because nothing was ever quoted.
      Capacity is deliberately small (~$140 P&L on ~$3.8k collateral per month).
    gate:
      question: Does the +3.4c/ct dead-heat fade replicate forward, net of adverse selection?
      metric: settled_tournaments
      source: p022_checkpoint
      reader: scripts/p022_checkpoint.py
      # AMENDMENT 1 (2026-07-28, Sam, at T=0): 14 -> 24. Same criterion (90%
      # power against the measured effect); the 2026-07-28 widening revised the
      # effect from +3.4c to +2.57c/ct and the rule's own solve gives 24.
      threshold: 24           # 90% power vs the measured +3.4c effect (rule §5)
      t_start_utc: 2026-07-26T22:36:52Z
      # progress is DERIVED by the reader. Do not hand-maintain it here.
      decision: >
        LOCKED in golf_quirks_research/P022_DECISION_RULE.md — read it, do not
        reinterpret. HARD KILL at any T if z <= -2.0. T<14 is NO DECISION
        (underpowered; a T=8 look has 23% power against half the effect and is
        explicitly forbidden). At T>=14: KILL if edge<=0, PASS if z>=2.0, else
        ONE extension to T=40 at byte-identical parameters and then KILL if
        still z<2.0. Caps are GATE CONDITIONS: a tournament with any cap
        breached is EXCLUDED from T, and raising a cap resets T to 0 under a new
        pod ID. PASS authorises more paper allocation and a written promotion
        proposal — never live money.
    watch:
      - >
        STILL CANNOT QUOTE — found 2026-07-27, the first time markets relisted.
        The 2026-07-26 reconciliation fixed the wrong half of the bug. Its
        evidence (occurrence_datetime running 13-18d past close_time on 10 of
        10) was measured on SETTLED markets, where Kalshi has already rewritten
        close_time to the real early-close stamp. On an OPEN market — the only
        state the pod ever sees when deciding to quote — all five time fields
        collapse to one ~20-day fallback, so preferring close_time over
        occurrence_datetime changes nothing. Confirmed live: at 00:22:20 UTC the
        runner discovered 346 markets across 3 events, every close reference
        2026-08-16T00:00Z (~479h out), and quoted nothing. See
